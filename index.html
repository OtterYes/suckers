{id:"cs20",d:"cs",sk:"Text Structure and Purpose",lv:3,p:"Some economists argue that raising the minimum wage leads businesses to hire fewer workers. Others counter that higher wages reduce employee turnover, saving businesses the cost of hiring and training replacements. {{A recent study of restaurants in neighboring counties found evidence for both effects: hiring slowed slightly, but workers stayed in their jobs longer.}}",q:"Which choice best describes the function of the underlined sentence in the text as a whole?",
c:["It presents findings suggesting that each of the two views has some support.","It shows that the first group of economists is right and the second is wrong.","It introduces a third view that contradicts both earlier arguments.","It explains why restaurants are the best type of business to study."],a:0,x:"Hiring slowed (supports view 1) and workers stayed longer (supports view 2): evidence for both.",t:"The study supports both sides, so it can’t prove one side wrong."},
{id:"cs21",d:"cs",sk:"Text Structure and Purpose",lv:2,p:"Before refrigerators, people in cold climates harvested ice from frozen lakes each winter. Workers cut the ice into large blocks, packed them in sawdust, and stored them in insulated icehouses, where the blocks could last well into summer. Ice harvesting became a major industry in the 1800s, with ships carrying ice from New England to distant ports.",q:"Which choice best states the main purpose of the text?",
c:["To describe how people preserved ice before refrigeration existed","To argue that ice harvesting was more efficient than modern refrigeration","To explain how refrigerators were invented","To criticize the working conditions of ice harvesters"],a:0,x:"The text simply describes how the ice trade worked. It makes no argument or criticism.",t:"The text never compares ice harvesting with modern refrigeration."},
{id:"cs22",d:"cs",sk:"Text Structure and Purpose",lv:3,p:"In her essay, the author recalls learning to cook from her grandmother, who never used written recipes. “A pinch,” her grandmother would say, or “until it looks right.” At first the author found these instructions frustrating. {{Only years later did she realize that her grandmother had been teaching her to trust her own judgment rather than follow rules.}}",q:"Which choice best describes the function of the underlined sentence in the text as a whole?",
c:["It reveals how the author’s understanding of an earlier experience changed over time.","It provides an example of one of the grandmother’s recipes.","It explains why the author never learned to cook.","It describes the grandmother’s frustration with the author."],a:0,x:"“At first … frustrating” then “Only years later did she realize”: the sentence shows her view changing.",t:"The frustration belonged to the author, not the grandmother."},
{id:"cs23",d:"cs",sk:"Text Structure and Purpose",lv:2,p:"Solar panels generate electricity only when the sun is shining, which creates a challenge for power grids at night. One solution is to store extra energy in large batteries during the day. {{Another is to pump water uphill into a reservoir when energy is plentiful and release it through turbines when energy is needed.}}",q:"Which choice best describes the function of the underlined sentence in the text as a whole?",
c:["It presents a second approach to the problem described earlier in the text.","It explains why batteries are the best way to store energy.","It describes a disadvantage of solar panels.","It questions whether the problem can be solved at all."],a:0,x:"“One solution … Another”: the underlined sentence gives the second solution.",t:"The disadvantage of solar panels comes in the first sentence, not the underlined one."},
{id:"cs24",d:"cs",sk:"Text Structure and Purpose",lv:3,p:"Critics often describe the painter as a realist, pointing to her detailed portraits of farmworkers. Yet a closer look at her work complicates that label. {{Her figures are often placed against backgrounds of flat, unrealistic color, and their proportions are subtly stretched.}}",q:"Which choice best describes the function of the underlined sentence in the text as a whole?",
c:["It gives details suggesting that the painter’s work does not fit neatly into one category.","It lists the reasons critics consider the painter a realist.","It argues that her portraits of farmworkers are her most important work.","It describes how her style changed over the course of her career."],a:0,x:"“Complicates that label” is the claim; flat, unrealistic color and stretched proportions are the evidence that she isn’t purely a realist.",t:"The details push against the realist label, so they can’t be reasons for it."},
/* ---------- Craft & Structure: Cross-Text Connections ---------- */
{id:"cs25",d:"cs",sk:"Cross-Text Connections",lv:3,p:"Text 1: Some psychologists argue that multitasking is a skill that improves with practice. In their view, people who regularly juggle several tasks, such as texting while doing homework, gradually become more efficient at switching their attention.",
p2:"Text 2: Researchers compared people who frequently multitask with people who rarely do. The frequent multitaskers performed worse on tests of focus and were more easily distracted by irrelevant information, suggesting that heavy multitasking may weaken attention rather than strengthen it.",
q:"Based on the texts, how would the researchers in Text 2 most likely respond to the view in Text 1?",
c:["They would argue that their findings cast doubt on the idea that frequent multitasking improves attention.","They would agree that frequent multitaskers are better at switching attention.","They would claim that texting while doing homework is the only harmful kind of multitasking.","They would suggest that the psychologists in Text 1 studied too many people."],a:0,x:"Text 1 says practice improves multitasking; Text 2 found frequent multitaskers did worse. Text 2 undercuts Text 1.",t:"Text 2 never singles out texting as the only harmful kind."},
{id:"cs26",d:"cs",sk:"Cross-Text Connections",lv:3,p:"Text 1: Many popular histories credit a single inventor with creating the first practical light bulb, describing a breakthrough achieved in one laboratory.",
p2:"Text 2: The historical record shows that dozens of inventors in several countries were experimenting with electric lighting at the same time, and many of their improvements were shared or borrowed. The “first practical light bulb” was less a single invention than the result of many people’s work.",
q:"Which choice best describes how Text 2 relates to Text 1?",
c:["Text 2 challenges the idea in Text 1 that one person was responsible for the invention.","Text 2 adds details about the laboratory mentioned in Text 1.","Text 2 agrees with Text 1 but focuses on a later period.","Text 2 argues that electric lighting was never practical."],a:0,x:"Text 1: one inventor. Text 2: many people’s work. Text 2 pushes back on Text 1.",t:"Text 2 disagrees with Text 1, so it isn’t adding supporting details."},
{id:"cs27",d:"cs",sk:"Cross-Text Connections",lv:2,p:"Text 1: Homework helps students practice the skills they learn in class. Without regular practice at home, students are likely to forget what they learned.",
p2:"Text 2: Practice matters, but studies of elementary school students have found little connection between the amount of homework assigned and students’ test scores. For younger students, shorter assignments may work just as well as longer ones.",
q:"How would the author of Text 2 most likely respond to Text 1?",
c:["By agreeing that practice matters while questioning whether more homework is always better, at least for younger students","By arguing that students should never be assigned homework","By claiming that students forget nothing they learn in class","By stating that homework matters more for younger students than for older ones"],a:0,x:"Text 2 opens with “Practice matters” (agreement) and then questions the amount of homework (qualification).",t:"“Never assign homework” is far more extreme than anything Text 2 says."},
{id:"cs28",d:"cs",sk:"Cross-Text Connections",lv:3,p:"Text 1: The decline of honeybee populations is often blamed on a single cause: a group of pesticides called neonicotinoids. Banning these chemicals, some advocates argue, would allow bee populations to recover.",
p2:"Text 2: Researchers studying bee colonies have identified several interacting threats, including parasitic mites, poor nutrition from shrinking wildflower habitat, and pesticide exposure. Addressing only one of these factors is unlikely to reverse the decline.",
q:"Based on the texts, how would the researchers in Text 2 most likely view the advocates’ argument in Text 1?",
c:["As incomplete, because it focuses on one cause when several factors contribute to the decline","As correct, because pesticides are the only serious threat to honeybees","As irrelevant, because honeybee populations are not actually declining","As convincing, because parasitic mites are harmless to bees"],a:0,x:"Text 2 lists several threats and says fixing one won’t be enough, so a single-cause argument is incomplete.",t:"Text 2 includes pesticides as one threat, but says they are not the only one."},
{id:"cs29",d:"cs",sk:"Cross-Text Connections",lv:2,p:"Text 1: Some architects favor glass-walled skyscrapers because they let in natural light and give occupants sweeping views of the city.",
p2:"Text 2: Glass walls can make buildings expensive to heat and cool, since glass lets heat escape in winter and lets in intense sunlight in summer. Some newer designs use fewer, carefully placed windows to balance light and energy use.",
q:"Which choice best describes how Text 2 relates to Text 1?",
c:["It points out a drawback of the design that Text 1 describes favorably.","It gives more examples of the benefits described in Text 1.","It argues that skyscrapers should not be built.","It explains how the architects in Text 1 became interested in glass."],a:0,x:"Text 1 praises glass walls; Text 2 raises an energy-cost drawback.",t:"Text 2 suggests better designs, not banning skyscrapers."},
{id:"cs30",d:"cs",sk:"Cross-Text Connections",lv:3,p:"Text 1: Some literary critics argue that a novel’s meaning is fixed by its author’s intentions. To understand a book, they claim, readers should learn as much as possible about what the author meant to say.",
p2:"Text 2: Other critics hold that once a book is published, readers bring their own experiences to it, and those experiences shape what the book means to them. On this view, a novel can hold meanings its author never intended.",
q:"How would the critics in Text 2 most likely respond to the claim in Text 1?",
c:["They would argue that an author’s intentions do not fully determine what a novel means.","They would agree that readers should focus only on the author’s intentions.","They would claim that authors never have intentions when writing.","They would argue that readers’ experiences are irrelevant to interpretation."],a:0,x:"Text 2 says novels can hold meanings the author never intended, so intentions don’t fully fix the meaning.",t:"Text 2 doesn’t deny that authors have intentions; it just says they aren’t the whole story."},
/* ---------- Expression of Ideas: Transitions ---------- */
{id:"eo01",d:"eoi",sk:"Transitions",lv:1,p:"Honeybees communicate through a series of movements known as the waggle dance. ______ a bee that has found food performs a dance that shows other bees the direction and distance of the source.",c:["For example,","However,","In contrast,","Nevertheless,"],a:0,x:"The second sentence gives a specific instance of the dance communication described in the first.",t:"There’s no contrast between the sentences, which rules out the other three."},
{id:"eo02",d:"eoi",sk:"Transitions",lv:2,p:"Many people assume that tomatoes originated in Italy, where they are central to the cuisine. ______ tomatoes are native to western South America and did not reach Europe until the 1500s.",c:["In fact,","Similarly,","For instance,","As a result,"],a:0,x:"The second sentence corrects the assumption in the first. “In fact” introduces the truth after a mistaken belief.",t:"“As a result” would mean the assumption caused tomatoes to be South American, which makes no sense."},
{id:"eo03",d:"eoi",sk:"Transitions",lv:2,p:"The city’s new bike lanes were separated from car traffic by concrete barriers. ______ the number of cyclists using the route doubled within a year.",c:["Consequently,","Nonetheless,","For example,","In other words,"],a:0,x:"Safer lanes led to more cyclists. That’s cause and effect.",t:"“Nonetheless” signals a surprise despite something, but more riders is the expected result."},
{id:"eo04",d:"eoi",sk:"Transitions",lv:2,p:"Early telephones required operators to connect calls by plugging cables into a switchboard. ______ automatic switching systems let callers dial numbers directly, making operators unnecessary for most calls.",c:["Later,","Similarly,","For instance,","Therefore,"],a:0,x:"The sentences move forward in time from manual switchboards to automatic switching.",t:"Operators didn’t cause automatic switching, so “Therefore” doesn’t fit."},
{id:"eo05",d:"eoi",sk:"Transitions",lv:3,p:"The drought cut the region’s wheat harvest by nearly 40 percent. ______ bread prices in local markets stayed stable, because the government released grain from its reserves.",c:["Nevertheless,","As a result,","Additionally,","For example,"],a:0,x:"You’d expect prices to jump after a bad harvest. They didn’t, so the second sentence is a surprise despite the first.",t:"“As a result” would say the drought caused stable prices. The reserves did that."},
{id:"eo06",d:"eoi",sk:"Transitions",lv:2,p:"Octopuses can change the color of their skin in a fraction of a second. ______ they can change its texture, raising small bumps to mimic rocks or coral.",c:["Moreover,","Instead,","For example,","Consequently,"],a:0,x:"Texture change is an additional ability on top of color change.",t:"Texture change isn’t an example of color change, so “For example” doesn’t work."},
{id:"eo07",d:"eoi",sk:"Transitions",lv:3,p:"Some critics dismissed the author’s first novel as overly sentimental. ______ it sold more copies in its first year than any of her later books.",c:["Even so,","Therefore,","Likewise,","Specifically,"],a:0,x:"Despite the criticism, it sold very well. “Even so” marks that concession.",t:"“Therefore” would mean the criticism caused the sales."},
{id:"eo08",d:"eoi",sk:"Transitions",lv:2,p:"Rain forests cover only about 6 percent of Earth’s land surface. ______ they are home to more than half of the world’s plant and animal species.",c:["However,","Similarly,","For this reason,","In addition,"],a:0,x:"Small area, huge share of species: the second sentence contrasts with the “only” in the first.",t:"“For this reason” would say their small size causes their diversity."},
{id:"eo09",d:"eoi",sk:"Transitions",lv:2,p:"A single dairy cow can produce more than 20 liters of milk a day. ______ a herd of 200 cows can produce over 4,000 liters daily, enough to supply a small town.",c:["Thus,","However,","Meanwhile,","In contrast,"],a:0,x:"The second sentence follows logically from the first (200 × 20 = 4,000).",t:"There’s no contrast, so “However” and “In contrast” don’t work."},
{id:"eo10",d:"eoi",sk:"Transitions",lv:2,p:"Mount Everest is the tallest mountain above sea level. ______ Mauna Kea in Hawaii is taller when measured from its base on the ocean floor.",c:["However,","Therefore,","For example,","Furthermore,"],a:0,x:"The second sentence qualifies the first. By another measure, a different mountain wins.",t:"“Furthermore” adds a similar point, but this sentence pushes back."},
{id:"eo11",d:"eoi",sk:"Transitions",lv:3,p:"The museum’s new exhibit focuses on everyday objects from ancient Rome. ______ rather than displaying famous statues or grand monuments, it presents cooking pots, children’s toys, and handwritten shopping lists.",c:["That is,","In contrast,","Nevertheless,","Finally,"],a:0,x:"The second sentence restates and clarifies “everyday objects” with specifics. “That is” signals clarification.",t:"“In contrast” would set the exhibit against itself."},
{id:"eo12",d:"eoi",sk:"Transitions",lv:2,p:"Sea turtles lay their eggs in nests dug into sandy beaches. ______ after hatching, the young turtles must make their way across the sand to the ocean, often at night.",c:["Then,","However,","For instance,","Similarly,"],a:0,x:"Laying eggs comes first, then the hatchlings head to sea. It’s a sequence.",t:"Nothing contrasts, so “However” is out."},
{id:"eo13",d:"eoi",sk:"Transitions",lv:3,p:"Scientists once believed that only humans used tools. ______ researchers have since observed chimpanzees using sticks to fish for termites and crows bending wire into hooks.",c:["However,","Similarly,","As a result,","In other words,"],a:0,x:"The observations overturn the old belief, which is a contrast.",t:"“As a result” would say the belief caused the observations."},
{id:"eo14",d:"eoi",sk:"Transitions",lv:2,p:"Maria practiced the violin for two hours every day for three years. ______ she won first place at the regional competition.",c:["Eventually,","Nevertheless,","In contrast,","For example,"],a:0,x:"After years of practice came the win. “Eventually” marks the payoff at the end of a long stretch.",t:"“Nevertheless” implies the win was surprising given the practice. It wasn’t."},
{id:"eo15",d:"eoi",sk:"Transitions",lv:3,p:"The first computers filled entire rooms and required teams of people to operate them. ______ today’s smartphones fit in a pocket and are thousands of times more powerful.",c:["By contrast,","As a result,","For example,","Similarly,"],a:0,x:"Room-sized versus pocket-sized: a direct contrast.",t:"Smartphones aren’t an example of room-sized computers."},
{id:"eo16",d:"eoi",sk:"Transitions",lv:2,p:"Recycling aluminum cans saves a great deal of energy. ______ making a can from recycled aluminum uses about 95 percent less energy than making one from raw ore.",c:["Specifically,","However,","Instead,","Meanwhile,"],a:0,x:"The second sentence gives the precise figure behind “a great deal of energy.”",t:"There’s no contrast, so “However” and “Instead” are out."},
{id:"eo17",d:"eoi",sk:"Transitions",lv:3,p:"The novel’s first chapter is told from the point of view of a young girl. ______ the second chapter shifts to the perspective of her grandfather, looking back on the same events decades later.",c:["In contrast,","Therefore,","For example,","Likewise,"],a:0,x:"Girl’s view versus grandfather’s view: a contrast.",t:"“Likewise” would claim the chapters share the same perspective."},
{id:"eo18",d:"eoi",sk:"Transitions",lv:2,p:"Venus is similar to Earth in size and mass. ______ its surface is hot enough to melt lead, making it very different from our planet.",c:["However,","Similarly,","For instance,","Accordingly,"],a:0,x:"Similar in size, very different in temperature. That’s a contrast.",t:"“Similarly” ignores the “very different” at the end of the sentence."},
{id:"eo19",d:"eoi",sk:"Transitions",lv:3,p:"Many desert plants have shallow, widespread roots that quickly absorb rainwater before it evaporates. ______ other desert plants, such as the mesquite tree, send roots deep underground to reach water far below the surface.",c:["In contrast,","Therefore,","For example,","Similarly,"],a:0,x:"Shallow roots versus deep roots: two opposite strategies.",t:"“For example” would make the mesquite an example of shallow roots."},
{id:"eo20",d:"eoi",sk:"Transitions",lv:2,p:"The chef wanted to reduce food waste in her restaurant. ______ she began using vegetable scraps to make soup stock.",c:["To that end,","Nevertheless,","In contrast,","Likewise,"],a:0,x:"The action serves the goal. “To that end” means “in order to reach that goal.”",t:"“Nevertheless” would mean she used scraps despite wanting less waste."},
{id:"eo21",d:"eoi",sk:"Transitions",lv:3,p:"Early studies suggested that the new medication was highly effective. ______ larger trials involving thousands of patients found that its benefits were much smaller than first reported.",c:["However,","Therefore,","Likewise,","For instance,"],a:0,x:"Later, larger trials contradicted the early results.",t:"“Therefore” would say the early results caused the smaller benefits."},
{id:"eo22",d:"eoi",sk:"Transitions",lv:2,p:"The town’s population grew rapidly after the railroad arrived in 1870. ______ new schools, churches, and shops were built to serve the growing number of residents.",c:["Accordingly,","Nonetheless,","In contrast,","Previously,"],a:0,x:"More residents led to more buildings. “Accordingly” signals a fitting result.",t:"“Previously” puts the building before the growth, but the text says they served the growing population."},
{id:"eo23",d:"eoi",sk:"Transitions",lv:3,p:"The Great Wall of China is often described as a single wall. ______ it is a series of walls and fortifications built by different dynasties over many centuries.",c:["In reality,","Similarly,","As a result,","For example,"],a:0,x:"The second sentence corrects a common description.",t:"“As a result” would say the description caused the wall’s structure."},
{id:"eo24",d:"eoi",sk:"Transitions",lv:2,p:"Some animals hibernate to survive the winter. Bears, ______ spend months in dens, living off fat stored during the summer and fall.",c:["for example,","however,","therefore,","in contrast,"],a:0,x:"Bears are an example of animals that hibernate.",t:"“In contrast” would mean bears don’t hibernate."},
{id:"eo25",d:"eoi",sk:"Transitions",lv:3,p:"Critics praised the film’s stunning visual effects. ______ many also noted that its plot was confusing and its characters poorly developed.",c:["At the same time,","As a result,","For example,","In other words,"],a:0,x:"Praise and criticism side by side. “At the same time” introduces the other side.",t:"The confusing plot isn’t a result of the praised effects."},
{id:"eo26",d:"eoi",sk:"Transitions",lv:1,p:"First, the students measured the height of each plant. ______ they recorded the measurements in a data table.",c:["Next,","However,","For example,","In contrast,"],a:0,x:"“First … Next” marks the steps of a process.",t:"Nothing contrasts, and recording isn’t an example of measuring."},
{id:"eo27",d:"eoi",sk:"Transitions",lv:2,p:"The author spent a decade researching the history of the region. ______ her book includes details that are not found in any earlier account.",c:["As a result,","Nevertheless,","By contrast,","For instance,"],a:0,x:"Years of research produced new details. That’s cause and effect.",t:"“Nevertheless” would mean the details appeared despite the research."},
{id:"eo28",d:"eoi",sk:"Transitions",lv:1,p:"Penguins cannot fly. ______ they are excellent swimmers, using their flipper-like wings to move quickly through the water.",c:["However,","Therefore,","Similarly,","For example,"],a:0,x:"Can’t fly, but can swim well: a contrast.",t:"Not flying doesn’t cause good swimming, so “Therefore” is wrong."},
{id:"eo29",d:"eoi",sk:"Transitions",lv:3,p:"The company’s profits rose sharply last year. ______ nearly all of the increase came from a single product, leaving the company vulnerable if demand for that product falls.",c:["However,","Consequently,","Likewise,","For example,"],a:0,x:"Good news, then a caveat that undercuts it. That’s a contrast.",t:"The reliance on one product isn’t caused by the rise in profits."},
{id:"eo30",d:"eoi",sk:"Transitions",lv:2,p:"Some birds migrate thousands of kilometers each year. The Arctic tern, ______ travels from the Arctic to the Antarctic and back, a round trip of roughly 70,000 kilometers.",c:["for instance,","however,","therefore,","in contrast,"],a:0,x:"The Arctic tern is an example of a long-distance migrant.",t:"“In contrast” would mean the tern doesn’t migrate far."},
/* ---------- Expression of Ideas: Rhetorical Synthesis ---------- */
{id:"eo31",d:"eoi",sk:"Rhetorical Synthesis",lv:2,n:["The platypus is a mammal native to eastern Australia.","Unlike most mammals, it lays eggs.","It uses its bill to detect electric fields produced by prey underwater.","Its young feed on milk produced by the mother."],goal:"emphasize a way in which the platypus differs from most mammals",
c:["Unlike most mammals, the platypus lays eggs.","The platypus, a mammal, is native to eastern Australia.","Platypus young feed on milk produced by their mother.","The platypus hunts for prey underwater."],a:0,x:"The goal is a difference from most mammals. Only this choice states one directly.",t:"Feeding young on milk is something most mammals do, so it’s a similarity."},
{id:"eo32",d:"eoi",sk:"Rhetorical Synthesis",lv:3,n:["Mary Anning (1799–1847) was a fossil collector in Lyme Regis, England.","As a young girl, she helped uncover one of the first ichthyosaur skeletons to be scientifically identified.","She later found one of the first plesiosaur skeletons.","Because she was a woman, she was excluded from the Geological Society of London."],goal:"present Anning’s discoveries to an audience unfamiliar with her",
c:["Anning was excluded from the Geological Society of London because she was a woman.","Mary Anning, a nineteenth-century fossil collector from Lyme Regis, England, found early ichthyosaur and plesiosaur skeletons.","One of the first ichthyosaur skeletons was uncovered with the help of a young girl.","Lyme Regis, England, was home to Mary Anning from 1799 to 1847."],a:1,x:"An unfamiliar audience needs to know who she was and what she found. Only this choice does both.",t:"The first choice is about her exclusion, not her discoveries."},
{id:"eo33",d:"eoi",sk:"Rhetorical Synthesis",lv:2,n:["Coral reefs cover less than 1% of the ocean floor.","They support about 25% of all marine species.","Rising ocean temperatures can cause corals to expel the algae living in their tissues, a process called bleaching.","Bleached corals can recover if temperatures return to normal quickly."],goal:"emphasize how important coral reefs are relative to their size",
c:["Although coral reefs cover less than 1% of the ocean floor, they support about 25% of all marine species.","Rising ocean temperatures can cause corals to bleach.","Bleached corals can recover if temperatures return to normal quickly.","Coral reefs, which can bleach, support many marine species."],a:0,x:"“Relative to their size” needs both numbers: tiny area, huge share of species.",t:"The last choice mentions species but leaves out the size comparison."},
{id:"eo34",d:"eoi",sk:"Rhetorical Synthesis",lv:3,n:["The Harlem Renaissance was a cultural movement centered in New York City’s Harlem neighborhood.","It flourished in the 1920s and early 1930s.","Langston Hughes wrote poetry that drew on the rhythms of jazz and blues.","Zora Neale Hurston wrote novels and collected folklore in the American South."],goal:"make a generalization about the kinds of work produced during the Harlem Renaissance",
c:["Langston Hughes wrote poetry that drew on the rhythms of jazz and blues.","The Harlem Renaissance flourished in the 1920s and early 1930s.","Writers of the Harlem Renaissance produced varied work, from jazz-influenced poetry to novels and collections of folklore.","Zora Neale Hurston collected folklore in the American South."],a:2,x:"A generalization covers the range of work. Only this choice sums up several kinds together.",t:"The first and last choices are single examples, not generalizations."},
{id:"eo35",d:"eoi",sk:"Rhetorical Synthesis",lv:2,n:["Tardigrades are microscopic animals about 0.5 millimeters long.","They can survive temperatures from near absolute zero to above 150°C.","They have survived short periods in the vacuum of space.","In harsh conditions, they dry out and enter a state called cryptobiosis."],goal:"explain how tardigrades survive harsh conditions",
c:["Tardigrades are microscopic animals about 0.5 millimeters long.","In harsh conditions, tardigrades dry out and enter a state called cryptobiosis.","Tardigrades have been studied by scientists for many years.","Tardigrades are about 0.5 millimeters long and live in many places."],a:1,x:"The goal is how they survive. Cryptobiosis is the mechanism.",t:"Their size doesn’t explain how they survive."},
{id:"eo36",d:"eoi",sk:"Rhetorical Synthesis",lv:3,n:["In 1928, Alexander Fleming noticed that mold had contaminated one of his bacteria cultures.","The bacteria near the mold had been killed.","The mold was later identified as a species of Penicillium.","Penicillin, the substance produced by the mold, became one of the first widely used antibiotics."],goal:"explain the significance of Fleming’s observation",
c:["In 1928, Alexander Fleming noticed mold in one of his bacteria cultures.","Fleming’s observation that mold had killed bacteria led to penicillin, one of the first widely used antibiotics.","The mold Fleming observed was later identified as a species of Penicillium.","Bacteria near the mold in Fleming’s culture had been killed."],a:1,x:"Significance means why it mattered: it led to one of the first widely used antibiotics.",t:"The first choice describes the observation but not why it mattered."},
{id:"eo37",d:"eoi",sk:"Rhetorical Synthesis",lv:2,n:["The Atacama Desert in Chile is one of the driest places on Earth.","Some of its weather stations have never recorded rain.","Its dry, clear skies make it an excellent location for astronomical observatories.","Several major telescopes have been built there."],goal:"explain why astronomers build telescopes in the Atacama Desert",
c:["The Atacama Desert in Chile is one of the driest places on Earth.","Some weather stations in the Atacama Desert have never recorded rain.","Because of its dry, clear skies, the Atacama Desert is an excellent place for astronomical observatories.","Several major telescopes have been built in Chile."],a:2,x:"“Why” calls for a reason. The clear skies are the reason.",t:"Dryness alone doesn’t mention astronomy at all."},
{id:"eo38",d:"eoi",sk:"Rhetorical Synthesis",lv:3,n:["Alligators have broad, U-shaped snouts.","Crocodiles have narrower, V-shaped snouts.","Alligators live mainly in freshwater habitats.","Many crocodile species can tolerate salt water."],goal:"contrast alligators and crocodiles in terms of habitat",
c:["Alligators have U-shaped snouts, while crocodiles have V-shaped snouts.","Alligators live mainly in freshwater habitats, whereas many crocodile species can tolerate salt water.","Alligators and crocodiles are both reptiles with distinctive snouts.","Many crocodile species can tolerate salt water."],a:1,x:"The goal names both a contrast and a topic (habitat). Only this choice does both.",t:"The first choice contrasts them, but by snout shape instead of habitat."},
{id:"eo39",d:"eoi",sk:"Rhetorical Synthesis",lv:2,n:["Maria Tallchief (1925–2013) was an American ballerina.","She was a member of the Osage Nation.","She is often called America’s first major prima ballerina.","She danced with the New York City Ballet from 1948 to 1965."],goal:"introduce Maria Tallchief and her significance",
c:["Maria Tallchief, a member of the Osage Nation, is often called America’s first major prima ballerina.","Maria Tallchief danced with the New York City Ballet from 1948 to 1965.","Maria Tallchief lived from 1925 to 2013.","The New York City Ballet employed many dancers between 1948 and 1965."],a:0,x:"An introduction says who she was. “First major prima ballerina” says why she matters.",t:"The dates are facts about her, but they don’t show her significance."},
{id:"eo40",d:"eoi",sk:"Rhetorical Synthesis",lv:3,n:["A study tested two groups of students on vocabulary.","Group 1 studied the words by rereading a list.","Group 2 studied the same words by quizzing themselves.","A week later, Group 2 remembered 50% more words than Group 1."],goal:"present the study’s conclusion",
c:["In the study, students who quizzed themselves remembered 50% more words a week later than students who reread a list.","The study tested two groups of students on vocabulary.","Group 1 studied by rereading a list, and Group 2 studied the same words.","Rereading a list is one way students study vocabulary."],a:0,x:"A conclusion states the result: self-quizzing beat rereading. (That’s also why this game quizzes you.)",t:"The second choice describes the setup, not the result."},
/* ---------- Standard English Conventions: Form, Structure, and Sense ---------- */
{id:"se01",d:"sec",sk:"Form, Structure, and Sense",lv:1,p:"The collection of rare coins ______ displayed in a locked glass case near the museum’s entrance.",c:["is","are","were","have been"],a:0,x:"The subject is “collection” (singular). “Of rare coins” is just a describing phrase.",t:"“Coins” sits right before the blank and tempts you toward a plural verb."},
{id:"se02",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"Each of the students who entered the science fair ______ required to submit a written report.",c:["was","were","are","have been"],a:0,x:"“Each” is singular, so it takes “was.”",t:"“Students” is inside the phrase “of the students,” so it isn’t the subject."},
{id:"se03",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"The results of the survey, which was conducted over three months, ______ that most residents support the new park.",c:["suggest","suggests","has suggested","is suggesting"],a:0,x:"The subject is “results” (plural). Skip the phrase and the clause between commas.",t:"“Survey” is singular, but it isn’t the subject of this verb."},
{id:"se04",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"When the museum reopened after renovations, ______ new wing featured interactive exhibits about local history.",c:["its","it’s","their","they’re"],a:0,x:"The museum (singular) owns the wing, so use the possessive “its.”",t:"“It’s” means “it is.” Test it: “it is new wing” doesn’t work."},
{id:"se05",d:"sec",sk:"Form, Structure, and Sense",lv:1,p:"The two scientists published ______ findings in a leading journal last spring.",c:["their","there","they’re","its"],a:0,x:"Plural owners (two scientists) take the plural possessive “their.”",t:"“There” is a place, and “they’re” means “they are.”"},
{id:"se06",d:"sec",sk:"Form, Structure, and Sense",lv:3,p:"Neither the coach nor the players ______ expecting the storm to delay the game.",c:["were","was","is","has been"],a:0,x:"With “neither … nor,” the verb agrees with the closer subject: “players” (plural), so “were.”",t:"“Coach” comes first, but the closer noun decides."},
{id:"se07",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"The ______ reports, written by all twenty-five members of the class, were collected at the end of the semester.",c:["students’","student’s","students","students’s"],a:0,x:"Many students own the reports, so use the plural possessive: students’.",t:"“Student’s” would mean one student, but the text says twenty-five members wrote them."},
{id:"se08",d:"sec",sk:"Form, Structure, and Sense",lv:3,p:"Walking through the ancient ruins, ______",c:["the visitors noticed carvings that had survived for centuries.","carvings that had survived for centuries caught the visitors’ attention.","the carvings had survived for centuries, and the visitors noticed them.","centuries had passed, but the visitors still noticed the carvings."],a:0,x:"Whoever is walking must come right after the comma. Only the visitors can walk.",t:"In the second choice, the carvings would be walking, which is a dangling modifier."},
{id:"se09",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"By the time the rescue team arrived, the hikers ______ for nearly six hours.",c:["had been waiting","wait","will wait","are waiting"],a:0,x:"The waiting happened before another past event (the team arrived), so use the past perfect: “had been waiting.”",t:"Present-tense choices clash with “arrived.”"},
{id:"se10",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"Every summer, the town ______ a festival that celebrates its founding, and thousands of visitors attend.",c:["hosts","hosted","had hosted","will have hosted"],a:0,x:"“Every summer” and “attend” are present tense, so the verb is “hosts.”",t:"“Hosted” is past tense and clashes with “attend.”"},
{id:"se11",d:"sec",sk:"Form, Structure, and Sense",lv:3,p:"The novel’s main character, a retired sailor who spends his days repairing old ______ is based on the author’s grandfather.",c:["boats,","boats","boats;","boats—"],a:0,x:"The extra description opened with a comma after “character,” so it must close with a comma.",t:"A dash can’t close a phrase that a comma opened. Match the pair."},
{id:"se12",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"The architect ______ designed the city’s tallest building also created several of its public parks.",c:["who","whom","which","whose"],a:0,x:"The blank is the subject of “designed,” and it refers to a person, so use “who.”",t:"“Which” is for things, and “whom” is for objects."},
{id:"se13",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"The recipe calls for three main ______ flour, butter, and sugar.",c:["ingredients:","ingredients,","ingredients;","ingredients"],a:0,x:"A complete sentence followed by a list: a colon introduces it.",t:"A semicolon needs complete sentences on both sides, and “flour, butter, and sugar” isn’t one."},
{id:"se14",d:"sec",sk:"Form, Structure, and Sense",lv:3,p:"Among the items found in the time capsule ______ a newspaper from 1925, a pocket watch, and a letter to future residents.",c:["were","was","is","has been"],a:0,x:"The sentence is inverted. The real subject comes after the verb: three items, so “were.”",t:"“Time capsule” sits right before the blank, but it’s inside a phrase."},
{id:"se15",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"The flock of geese ______ south every autumn, stopping at the same lake along the way.",c:["flies","fly","flying","have flown"],a:0,x:"“Flock” is a singular collective noun, so it takes “flies.”",t:"“Geese” is inside the phrase “of geese,” and “flying” would leave the sentence without a main verb."},
{id:"se16",d:"sec",sk:"Form, Structure, and Sense",lv:1,p:"The hikers took off ______ backpacks and sat down to rest at the summit.",c:["their","there","they’re","its"],a:0,x:"The hikers (plural) own the backpacks, so use “their.”",t:"“They’re” means “they are.”"},
{id:"se17",d:"sec",sk:"Form, Structure, and Sense",lv:3,p:"The team’s goals are to make the software easier to use, to reduce its cost, and ______",c:["to improve its security.","improving its security.","its security will be improved.","security improvements."],a:0,x:"Items in a list must be parallel: “to make … to reduce … to improve.”",t:"“Improving” breaks the “to ___” pattern."},
{id:"se18",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"Each of the paintings in the exhibit has a small card beside ______ that explains the work’s history.",c:["it","them","they","those"],a:0,x:"Each card sits beside one painting (“each”), so use the singular “it.”",t:"“Them” agrees with “paintings,” but the subject is “each.”"},
{id:"se19",d:"sec",sk:"Boundaries",lv:3,p:"In 1969, astronauts Neil Armstrong and Buzz Aldrin became the first people to walk on the ______ Michael Collins remained in orbit aboard the command module.",c:["Moon, while","Moon while,","Moon; while","Moon. While"],a:0,x:"“While Michael Collins remained …” is a dependent clause, so a comma attaches it to the main sentence.",t:"A period or semicolon would leave “While … module.” stranded as a fragment."},
{id:"se20",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"The documentary, which features interviews with dozens of ______ explores how the city’s music scene changed over fifty years.",c:["musicians,","musicians","musicians;","musicians—"],a:0,x:"The extra clause opened with a comma after “documentary,” so it closes with a comma.",t:"Leaving it out makes the reader think the musicians explore the music scene."},
{id:"se21",d:"sec",sk:"Form, Structure, and Sense",lv:3,p:"The documentary—which features interviews with dozens of ______ explores how the city’s music scene changed over fifty years.",c:["musicians—","musicians,","musicians;","musicians"],a:0,x:"The interruption opened with a dash, so it must close with a dash.",t:"A comma can’t close a dash-opened phrase. Match the pair."},
{id:"se22",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"Once a small fishing village, the town ______ into a popular tourist destination over the past century.",c:["has grown","grows","will grow","is growing"],a:0,x:"“Over the past century” describes change up to now, so use the present perfect: “has grown.”",t:"“Is growing” describes something happening right now, not over a whole past century."},
{id:"se23",d:"sec",sk:"Form, Structure, and Sense",lv:3,p:"Researchers studying the fossil ______ that the animal was about the size of a house cat.",c:["concluded","concluding","to conclude","having concluded"],a:0,x:"The sentence needs a main verb for “Researchers.” Only “concluded” is one.",t:"“Concluding” and “having concluded” can’t be main verbs, so they leave a fragment."},
{id:"se24",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"The city’s oldest ______ built in 1850, is now a museum dedicated to local history.",c:["house,","house","house;","house:"],a:0,x:"“Built in 1850” is extra information set off by a pair of commas, and the closing comma is already there.",t:"Without the opening comma, the sentence has a lone comma between the subject and the verb."},
{id:"se25",d:"sec",sk:"Form, Structure, and Sense",lv:3,p:"The number of students enrolled in the robotics club ______ doubled since last year.",c:["has","have","are","were"],a:0,x:"“The number” is singular. (“A number of” would be plural.)",t:"“Students” and “robotics club” are both inside phrases."},
{id:"se26",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"Unlike ______ the new phone model has a battery that lasts two full days.",c:["the previous model,","the previous model","the previous model:","the previous model;"],a:0,x:"An introductory phrase is followed by a comma before the main sentence.",t:"A semicolon or colon needs a complete sentence before it."},
{id:"se27",d:"sec",sk:"Form, Structure, and Sense",lv:3,p:"Of the twelve entries in the competition, the judges were most impressed by one ______ design, which used recycled materials to build a solar-powered shelter.",c:["team’s","teams","teams’","teams’s"],a:0,x:"“One team” owns the design, so use the singular possessive: team’s.",t:"“Teams’” is plural possessive, which clashes with “one.”"},
{id:"se28",d:"sec",sk:"Form, Structure, and Sense",lv:3,p:"Known for its bright red feathers, ______",c:["the northern cardinal is a common sight at backyard bird feeders.","backyard bird feeders often attract the northern cardinal.","many people enjoy seeing the northern cardinal at feeders.","bird watchers often spot the northern cardinal at feeders."],a:0,x:"The thing known for red feathers must come right after the comma: the cardinal.",t:"The other choices put feeders, people, or bird watchers right after the comma."},
{id:"se29",d:"sec",sk:"Form, Structure, and Sense",lv:1,p:"The orchestra performed three pieces: a symphony by Mozart, a concerto by Vivaldi, ______ a new work by a local composer.",c:["and","and,","; and",", and,"],a:0,x:"The comma before the blank is already there, so just add “and” before the last item.",t:"Don’t put a comma after “and.”"},
{id:"se30",d:"sec",sk:"Form, Structure, and Sense",lv:3,p:"The scientist’s notebooks, ______ were donated to the university after her death, contain detailed sketches of the plants she studied.",c:["which","that","they","these"],a:0,x:"After a comma, an extra (nonessential) clause about things uses “which.”",t:"“They” would create a comma splice, and “that” can’t follow a comma in this kind of clause."},
{id:"se31",d:"sec",sk:"Form, Structure, and Sense",lv:1,p:"Last year, the school ______ a new policy that lets students use calculators on all math tests.",c:["adopted","adopts","will adopt","is adopting"],a:0,x:"“Last year” calls for the past tense.",t:"The other choices don’t match a finished past action."},
{id:"se32",d:"sec",sk:"Form, Structure, and Sense",lv:2,p:"The Sahara Desert, which covers much of North Africa, ______ roughly the same size as the United States.",c:["is","are","being","have been"],a:0,x:"The subject is “The Sahara Desert” (singular). Skip the clause between commas.",t:"“Being” leaves the sentence without a main verb."}
];

function mulberry32(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function RI(R,a,b){return a+Math.floor(R()*(b-a+1));}
function PK(R,arr){return arr[Math.floor(R()*arr.length)];}
function NZ(R,a,b){var v;do{v=RI(R,a,b);}while(v===0);return v;}
function GCD(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
function SH(R,arr){arr=arr.slice();for(var i=arr.length-1;i>0;i--){var j=Math.floor(R()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
var MINUS="−";
function ESC(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function TRIM(x){return String(+(+x).toFixed(6));}
function N(n){var a=Math.abs(n);var s=Number.isInteger(a)?(a>=10000?a.toLocaleString("en-US"):String(a)):TRIM(a);return(n<0?MINUS:"")+s;}
function PN(n){return n<0?"("+N(n)+")":N(n);}
function MONEY(x){return(Math.round(x*100)/100).toFixed(2);}
function V(v){return "<i>"+v+"</i>";}
function SUP(e){return "<sup>"+e+"</sup>";}
var X=V("x"),Y=V("y"),X2=V("x")+SUP(2),X3=V("x")+SUP(3),Y2=V("y")+SUP(2);
function FR(n,d){if(d<0){n=-n;d=-d;}var g=GCD(n,d)||1;n/=g;d/=g;if(d===1)return N(n);return(n<0?MINUS:"")+'<span class="fr"><span>'+Math.abs(n)+"</span><span>"+d+"</span></span>";}
function FRT(n,d){if(d<0){n=-n;d=-d;}var g=GCD(n,d)||1;n/=g;d/=g;return d===1?String(n):n+"/"+d;}
function FRH(top,bot){return '<span class="fr"><span>'+top+"</span><span>"+bot+"</span></span>";}
function PIF(n,d){d=d||1;if(d<0){n=-n;d=-d;}var g=GCD(n,d)||1;n/=g;d/=g;var sg=n<0?MINUS:"";var a=Math.abs(n);var top=(a===1?"":a)+"π";if(d===1)return sg+top;return sg+FRH(top,d);}
function ROOT(n,inner){var sym=n===2?"√":n===3?"∛":n===4?"∜":'<sup class="ix">'+n+"</sup>√";return '<span class="rt">'+sym+'<span class="rad">'+inner+"</span></span>";}
function TERM(c,v,first){if(c===0)return "";var a=Math.abs(c);var sign=c<0?(first?MINUS:" "+MINUS+" "):(first?"":" + ");var coef=(v&&a===1)?"":N(a);return sign+coef+(v||"");}
function POLY(terms){var out="",first=true;for(var i=0;i<terms.length;i++){var c=terms[i][0];if(c===0)continue;out+=TERM(c,terms[i][1],first);first=false;}return out||"0";}
function NO(v,suf){return{v:v,h:N(v)+(suf||"")};}
function FO(n,d){return{v:n/d,h:FR(n,d),k:FRT(n,d)};}
function TO(txt){return{v:txt,h:txt,k:"t:"+txt};}
function KEY(o){return o.k!=null?String(o.k):(typeof o.v==="number"?String(Math.round(o.v*1e6)/1e6):String(o.h));}
function MCB(R,correct,wrongs,numeric,fill){
  var list=[correct],keys={};keys[KEY(correct)]=1;
  for(var i=0;i<wrongs.length&&list.length<4;i++){var w=wrongs[i];if(!w)continue;if(numeric&&(typeof w.v!=="number"||!isFinite(w.v)))continue;var k=KEY(w);if(keys[k])continue;keys[k]=1;list.push(w);}
  var guard=0;while(list.length<4&&fill&&guard<60){guard++;var f=fill(guard);if(!f)continue;if(numeric&&(typeof f.v!=="number"||!isFinite(f.v)))continue;var kf=KEY(f);if(keys[kf])continue;keys[kf]=1;list.push(f);}
  if(list.length<4)return null;
  if(numeric)list.sort(function(p,q){return p.v-q.v;});else list=SH(R,list);
  return{c:list.map(function(o){return o.h;}),a:list.indexOf(correct)};
}
function nearFill(R,v,suf){return function(i){return NO(v+(R()<0.5?-1:1)*RI(R,1,3+i),suf);};}
function withMC(R,item,correct,wrongs,numeric,fill){var m=MCB(R,correct,wrongs,numeric,fill);if(!m)return null;item.c=m.c;item.a=m.a;return item;}
function EQ(l,r){return l+" = "+r;}
function SYS(a,b){return '<span class="sys">'+a+"<br>"+b+"</span>";}

DEF("alg.lin1","alg","Linear equations in one variable",[1,2],function(R,lv){
  var x0=NZ(R,-9,12),a=PK(R,[2,3,4,5,6,7]),b=NZ(R,-8,8),c;do{c=RI(R,1,9);}while(c===a);
  var d=a*(x0+b)-c*x0,k=a-c,rhs=d-a*b;
  var L=a+"("+POLY([[1,X],[b,""]])+")",Rt=POLY([[c,X],[d,""]]);
  var it={lv:lv,stem:"What value of "+X+" satisfies the equation "+EQ(L,Rt)+"?",
    x:"Distribute the "+a+": "+EQ(POLY([[a,X],[a*b,""]]),Rt)+". Move the "+X+"-terms to one side and the numbers to the other: "+EQ(POLY([[k,X]]),N(rhs))+". Divide by "+N(k)+": "+X+" = "+N(x0)+".",
    t:"Multiply the "+a+" by <b>both</b> terms in the parentheses. Forgetting to multiply the "+N(b)+" is the classic slip.",
    des:"Graph "+Y+" = "+L+" and "+Y+" = "+Rt+". The "+X+"-coordinate of the intersection is the answer."};
  if(lv>=2&&R()<0.6){it.lv=2;it.spr={vals:[x0]};return it;}
  it.lv=1;
  var w1=(d-b)%k===0?NO((d-b)/k):null,w2=(d+a*b)%k===0?NO((d+a*b)/k):null;
  return withMC(R,it,NO(x0),[w1,w2,NO(-x0),NO(x0+PK(R,[-2,2]))],true,nearFill(R,x0));
});
DEF("alg.plans","alg","Linear equations in one variable",[2],function(R){
  var x0=RI(R,3,18),b=RI(R,12,40),d;do{d=RI(R,5,35);}while(d>=b);
  var a=RI(R,2,12)*5,c=a+(b-d)*x0;
  return{lv:2,stem:"Phone plan A costs $"+a+" to start plus $"+b+" per month. Plan B costs $"+c+" to start plus $"+d+" per month. After how many months will the total cost of the two plans be the same?",
    spr:{vals:[x0]},
    x:"Set the costs equal: "+a+" + "+b+V("m")+" = "+c+" + "+d+V("m")+". Subtract: "+(b-d)+V("m")+" = "+(c-a)+", so "+V("m")+" = "+x0+".",
    des:"Graph "+Y+" = "+a+" + "+b+X+" and "+Y+" = "+c+" + "+d+X+". The lines cross at "+X+" = "+x0+"."};
});
DEF("alg.func","alg","Linear functions",[2],function(R){
  var m=NZ(R,-6,6),b=RI(R,-10,10),p=RI(R,-4,4),r=p+RI(R,1,5),t;do{t=RI(R,-6,10);}while(t===p||t===r);
  var q=m*p+b,s=m*r+b,ans=m*t+b,f=V("f");
  var it={lv:2,stem:"For the linear function "+f+", "+f+"("+N(p)+") = "+N(q)+" and "+f+"("+N(r)+") = "+N(s)+". What is the value of "+f+"("+N(t)+")?",
    x:"Slope = ("+N(s)+" "+MINUS+" "+PN(q)+") ÷ ("+N(r)+" "+MINUS+" "+PN(p)+") = "+N(s-q)+" ÷ "+N(r-p)+" = "+N(m)+". Use "+f+"("+N(p)+") = "+N(q)+" to find the "+Y+"-intercept: "+N(q)+" "+MINUS+" "+PN(m)+"·"+PN(p)+" = "+N(b)+". So "+f+"("+X+") = "+POLY([[m,X],[b,""]])+" and "+f+"("+N(t)+") = "+N(ans)+".",
    t:"Find the slope first, then the intercept. Plugging "+N(t)+" into a slope-only equation forgets the intercept.",
    des:"Put the two points in a table and type "+V("y")+"<sub>1</sub> ~ "+V("m")+V("x")+"<sub>1</sub> + "+V("b")+". Desmos gives the line; then evaluate at "+N(t)+"."};
  if(R()<0.4){it.spr={vals:[ans]};return it;}
  return withMC(R,it,NO(ans),[NO(m*t),NO(-m*t+b),NO(ans+m),NO(m*t-b)],true,nearFill(R,ans));
});

 {v:["h","w"],gen:function(R){return[RI(R,3,20),PK(R,[1.5,2,2.5,3,3.5])];},eq:function(b,s){return V("h")+" = "+b+" + "+TRIM(s)+V("w");},

 {v:["F","d"],gen:function(R){return[PK(R,[2.5,3,3.5,4,4.5]),PK(R,[1.75,2,2.25,2.5,2.75])];},eq:function(b,s){return V("F")+" = "+MONEY(b)+" + "+MONEY(s)+V("d");},

 {v:["B","h"],gen:function(R){return[PK(R,[80,85,90,95,100]),RI(R,6,15)];},eq:function(b,s){return V("B")+" = "+b+" "+MINUS+" "+s+V("h");},

 {v:["S","w"],gen:function(R){return[RI(R,4,30)*10,RI(R,3,10)*5];},eq:function(b,s){return V("S")+" = "+b+" + "+s+V("w");},
  intro:"Jordan had some money in a savings account and then deposited the same amount each week. The amount "+V("S")+", in dollars, in the account after "+V("w")+" weeks is given by the equation ",
  sQ:"The amount, in dollars, Jordan deposits each week",bQ:"The amount, in dollars, in the account before the weekly deposits began",wr:["The total amount, in dollars, in the account after "+V("w")+" weeks","The number of weeks Jordan has been saving","The total amount, in dollars, deposited over "+V("w")+" weeks"]}

DEF("alg.model","alg","Linear functions",[1,2],function(R,lv){
  var M=PK(R,MODELS),bs,b,s,g=0;
  do{bs=M.gen(R);b=bs[0];s=bs[1];g++;}while(g<50&&(b===s||String(b).indexOf(TRIM(s))>=0||TRIM(s).indexOf(String(b))>=0));
  if(b===s)return null;
  var slope=lv>=2?true:(lv===1?false:R()<0.5);
  var shown=slope?(M.v[0]==="F"?MONEY(s):TRIM(s)):(M.v[0]==="F"?MONEY(b):String(b));
  var correct=TO(slope?M.sQ:M.bQ),other=TO(slope?M.bQ:M.sQ);
  var it={lv:slope?2:1,stem:M.intro+M.eq(b,s)+". What is the best interpretation of "+shown+" in this context?",
    x:slope?"In a linear model, the number multiplied by the variable is the rate of change: how much the output changes for each 1-unit increase in the input. Here that’s "+M.sQ.charAt(0).toLowerCase()+M.sQ.slice(1)+".":"The constant term is the output when the input is 0, the starting value. Here that’s "+M.bQ.charAt(0).toLowerCase()+M.bQ.slice(1)+".",
    t:slope?"Don’t confuse the rate (the coefficient) with the starting value (the constant).":"The constant is the value at the start, not the rate."};
  return withMC(R,it,correct,[other,TO(M.wr[0]),TO(M.wr[slope?1:2]),TO(M.wr[slope?2:1])],false);
});
DEF("alg.icpt","alg","Linear equations in two variables",[1,2],function(R,lv){
  var X0=NZ(R,-9,9),Y0=NZ(R,-9,9),A=Y0,B=X0,C=X0*Y0,g=GCD(GCD(A,B),C);A/=g;B/=g;C/=g;if(A<0){A=-A;B=-B;C=-C;}
  var eq=EQ(POLY([[A,X],[B,Y]]),N(C));
  if(lv>=2&&Math.abs(A)!==Math.abs(B)){
    var it={lv:2,stem:"What is the slope of the graph of "+eq+" in the "+X+Y+"-plane?",
      x:"Solve for "+Y+" to get slope-intercept form. For "+V("A")+X+" + "+V("B")+Y+" = "+V("C")+", that gives "+Y+" = "+MINUS+FRH(V("A"),V("B"))+X+" + "+FRH(V("C"),V("B"))+", so the slope is "+MINUS+FRH(V("A"),V("B"))+" = "+MINUS+FRH(N(A),PN(B))+" = "+FR(-A,B)+".",
      t:"The slope of "+V("A")+X+" + "+V("B")+Y+" = "+V("C")+" is "+MINUS+V("A")+"/"+V("B")+", not "+V("B")+"/"+V("A")+"."};
    return withMC(R,it,FO(-A,B),[FO(A,B),FO(-B,A),FO(B,A)],true);
  }
  var xa=R()<0.5,ans=xa?X0:Y0;
  var it2={lv:1,stem:"In the "+X+Y+"-plane, the graph of "+eq+" intersects the "+(xa?X:Y)+"-axis at "+(xa?"("+V("a")+", 0)":"(0, "+V("a")+")")+". What is the value of "+V("a")+"?",
    x:"On the "+(xa?X:Y)+"-axis, "+(xa?Y:X)+" = 0. Then "+EQ(POLY([[xa?A:B,xa?X:Y]]),N(C))+", so "+(xa?X:Y)+" = "+N(ans)+".",
    t:"To find where a graph crosses the "+(xa?X:Y)+"-axis, set the <b>other</b> variable to 0."};
  if(R()<0.5){it2.spr={vals:[ans]};return it2;}
  return withMC(R,it2,NO(ans),[NO(xa?Y0:X0),NO(-ans),NO(C)],true,nearFill(R,ans));
});
DEF("alg.sys","alg","Systems of two linear equations",[2,3],function(R,lv){
  var x0=RI(R,-6,9),y0=RI(R,-6,9),a1,b1,a2,b2;
  do{a1=NZ(R,-6,6);b1=NZ(R,-6,6);a2=NZ(R,-6,6);b2=NZ(R,-6,6);}while(a1*b2-a2*b1===0||(Math.abs(a1)===Math.abs(a2)&&Math.abs(b1)===Math.abs(b2)));
  var c1=a1*x0+b1*y0,c2=a2*x0+b2*y0;
  var ask=lv>=3?PK(R,["sum","diff"]):PK(R,["x","y"]);
  var askH={x:X,y:Y,sum:X+" + "+Y,diff:X+" "+MINUS+" "+Y}[ask];
  var ans={x:x0,y:y0,sum:x0+y0,diff:x0-y0}[ask];
  var e1=EQ(POLY([[a1,X],[b1,Y]]),N(c1)),e2=EQ(POLY([[a2,X],[b2,Y]]),N(c2));
  var kY=a2*b1-a1*b2,kC=a2*c1-a1*c2;
  var it={lv:lv>=3?3:2,stem:SYS(e1,e2)+"The solution to the given system of equations is ("+X+", "+Y+"). What is the value of "+askH+"?",
    x:"Eliminate "+X+": multiply the first equation by "+PN(a2)+" and the second by "+PN(a1)+", then subtract. That leaves "+EQ(POLY([[kY,Y]]),N(kC))+", so "+Y+" = "+N(y0)+". Substitute back to get "+X+" = "+N(x0)+". So "+askH+" = "+N(ans)+".",
    t:"Answer the question that’s asked. After solving, double-check whether it wants "+X+", "+Y+", or a combination.",
    des:"Type both equations and tap the intersection: ("+N(x0)+", "+N(y0)+")."};
  if(R()<0.35){it.spr={vals:[ans]};return it;}
  var w={x:[NO(y0),NO(-x0),NO(x0+y0)],y:[NO(x0),NO(-y0),NO(x0+y0)],sum:[NO(x0-y0),NO(y0-x0),NO(-(x0+y0)),NO(x0*y0)],diff:[NO(x0+y0),NO(y0-x0),NO(x0*y0)]}[ask];
  return withMC(R,it,NO(ans),w,true,nearFill(R,ans));
});
DEF("alg.nosol","alg","Systems of two linear equations",[3],function(R){
  var a=NZ(R,-6,6),b=NZ(R,-5,5),c=NZ(R,-12,12),m=PK(R,[2,3,4,-2,-3]);
  var e1=EQ(POLY([[a,X],[b,Y]]),N(c));
  if(R()<0.6){
    var e=m*c+NZ(R,-9,9),k=m*a;
    var e2=EQ(V("k")+X+TERM(m*b,Y,false),N(e));
    var it={lv:3,stem:SYS(e1,e2)+"In the given system of equations, "+V("k")+" is a constant. If the system has no solution, what is the value of "+V("k")+"?",
      x:"No solution means parallel lines: the "+X+"- and "+Y+"-coefficients are in the same ratio, but the constants are not. The "+Y+"-coefficients are "+N(b)+" and "+N(m*b)+", a ratio of "+N(m)+". So "+V("k")+" = "+N(m)+" × "+PN(a)+" = "+N(k)+". The constants "+N(m)+" × "+PN(c)+" = "+N(m*c)+" and "+N(e)+" don’t match, so the lines never meet.",
      t:"Matching coefficients alone isn’t enough in general: if the constants also matched, you’d get infinitely many solutions instead.",
      des:"Add a slider for "+V("k")+". At "+V("k")+" = "+N(k)+" the two lines become parallel."};
    if(R()<0.3){it.spr={vals:[k]};return it;}
    return withMC(R,it,NO(k),[NO(-k),NO(a),NO(m*b),NO(k+m)],true,nearFill(R,k));
  }
  var p=m*c;
  var e2b=EQ(POLY([[m*a,X],[m*b,Y]]),V("p"));
  var it2={lv:3,stem:SYS(e1,e2b)+"In the given system of equations, "+V("p")+" is a constant. If the system has infinitely many solutions, what is the value of "+V("p")+"?",
    x:"Infinitely many solutions means both equations describe the same line, so the second equation is exactly "+N(m)+" times the first. Then "+V("p")+" = "+N(m)+" × "+PN(c)+" = "+N(p)+".",
    t:"The multiplier "+N(m)+" comes from comparing the coefficients: "+N(m*a)+" ÷ "+PN(a)+".",
    des:"Graph both with a slider for "+V("p")+". At "+V("p")+" = "+N(p)+" the lines sit on top of each other."};
  if(R()<0.4){it2.spr={vals:[p]};return it2;}
  return withMC(R,it2,NO(p),[NO(c),NO(-p),NO(p+m),NO(c+m)],true,nearFill(R,p));
});
DEF("alg.ineq","alg","Linear inequalities",[1,2],function(R,lv){
  var a,c;do{a=RI(R,-6,8);c=RI(R,-6,8);}while(a===c);
  var k=a-c;if(lv===1&&k<0){var tmp=a;a=c;c=tmp;k=-k;}if(lv>=2&&k>0){var tmp2=a;a=c;c=tmp2;k=-k;}
  var B=RI(R,-8,8),b=RI(R,-12,12),d=k*B+b,op=PK(R,["<",">"]);
  var fin=k>0?op:(op==="<"?">":"<");
  var good=fin==="<"?B-RI(R,1,4):B+RI(R,1,4);
  var wr=fin==="<"?[B,B+RI(R,1,3),B+RI(R,4,7)]:[B,B-RI(R,1,3),B-RI(R,4,7)];
  var H=function(o){return o==="<"?"&lt;":"&gt;";};
  var it={lv:k<0?2:1,stem:"Which value of "+X+" is a solution to the inequality "+POLY([[a,X],[b,""]])+" "+H(op)+" "+POLY([[c,X],[d,""]])+"?",
    x:"Collect like terms: "+POLY([[k,X]])+" "+H(op)+" "+N(k*B)+". "+(k<0?"Dividing by a negative number flips the inequality: ":"Divide by "+k+": ")+X+" "+H(fin)+" "+N(B)+". Of the choices, only "+N(good)+" works.",
    t:(k<0?"Dividing by "+N(k)+" flips the sign. Forgetting that points you to the wrong side of "+N(B)+". ":"")+N(B)+" itself makes both sides equal, and the inequality is strict, so it isn’t a solution.",
    des:"Graph both sides as lines and see where one is "+(op==="<"?"below":"above")+" the other."};
  return withMC(R,it,NO(good),wr.map(function(v){return NO(v);}),true,function(i){return NO(fin==="<"?B+i+3:B-i-3);});
});

DEF("adv.quad","adv","Nonlinear equations",[2],function(R){
  var r1=NZ(R,-9,9),r2;do{r2=NZ(R,-9,9);}while(r2===r1||r2===-r1);
  var A=PK(R,[1,1,1,2,3]),B=-A*(r1+r2),C=A*r1*r2;
  var eq=EQ(POLY([[A,X2],[B,X],[C,""]]),"0");
  var opts=["sum","product"];if(r1*r2<0)opts.push("positive");
  var ask=PK(R,opts),ans=ask==="sum"?r1+r2:ask==="product"?r1*r2:Math.max(r1,r2);
  var fac=(A>1?A:"")+"("+POLY([[1,X],[-r1,""]])+")("+POLY([[1,X],[-r2,""]])+") = 0";
  var askH={sum:"the sum of the solutions",product:"the product of the solutions",positive:"the positive solution"}[ask];
  var it={lv:2,stem:eq+"<br>What is "+askH+" to the given equation?",
    x:"Factor: "+fac+", so "+X+" = "+N(r1)+" or "+X+" = "+N(r2)+". "+(ask==="sum"?"Sum: "+N(r1+r2)+". Shortcut: sum = "+MINUS+V("b")+"/"+V("a")+" = "+FR(-B,A)+".":ask==="product"?"Product: "+N(r1*r2)+". Shortcut: product = "+V("c")+"/"+V("a")+" = "+FR(C,A)+".":"The positive one is "+N(ans)+"."),
    t:ask==="sum"?"The sum is "+MINUS+V("b")+"/"+V("a")+", not "+V("b")+"/"+V("a")+". Watch the sign.":"Solve the equation first; don’t read numbers straight off the coefficients.",
    des:"Graph "+Y+" = "+POLY([[A,X2],[B,X],[C,""]])+" and tap the "+X+"-intercepts: "+N(r1)+" and "+N(r2)+"."};
  if(R()<0.35){it.spr={vals:[ans]};return it;}
  var w=ask==="sum"?[NO(-(r1+r2)),NO(r1*r2),NO(r1-r2),NO(B)]:ask==="product"?[NO(-(r1*r2)),NO(r1+r2),NO(C),NO(B)]:[NO(Math.min(r1,r2)),NO(-ans),NO(r1+r2)];
  return withMC(R,it,NO(ans),w,true,nearFill(R,ans));
});
DEF("adv.vertex","adv","Nonlinear functions",[2,3],function(R,lv){
  var f=V("f");
  if(lv<3){
    var a=PK(R,[1,2,3,-1,-2,-3]),h=NZ(R,-8,8),k=RI(R,-12,12);
    var expr=(a===1?"":a===-1?MINUS:N(a))+"("+POLY([[1,X],[-h,""]])+")"+SUP(2)+TERM(k,"",false);
    var mx=a<0;
    var it={lv:2,stem:"The function "+f+" is defined by "+f+"("+X+") = "+expr+". What is the "+(mx?"maximum":"minimum")+" value of "+f+"("+X+")?",
      x:"In vertex form "+V("a")+"("+X+" "+MINUS+" "+V("h")+")"+SUP(2)+" + "+V("k")+", the vertex is ("+V("h")+", "+V("k")+"). Here it’s ("+N(h)+", "+N(k)+"). Since "+V("a")+" is "+(mx?"negative, the parabola opens down, so ":"positive, the parabola opens up, so ")+N(k)+" is the "+(mx?"maximum":"minimum")+".",
      t:"The "+(mx?"maximum":"minimum")+" <b>value</b> is the "+Y+"-coordinate of the vertex ("+N(k)+"), not the "+X+"-coordinate ("+N(h)+").",
      des:"Graph it and tap the vertex."};
    if(R()<0.3){it.spr={vals:[k]};return it;}
    return withMC(R,it,NO(k),[NO(h),NO(-h),NO(-k),NO(a+k)],true,nearFill(R,k));
  }
  var b=NZ(R,-6,6)*2,c=RI(R,-15,15),hh=-b/2,mn=c-b*b/4;
  var askX=R()<0.4,ans2=askX?hh:mn;
  var it2={lv:3,stem:"The function "+f+" is defined by "+f+"("+X+") = "+POLY([[1,X2],[b,X],[c,""]])+". "+(askX?"For what value of "+X+" does "+f+"("+X+") reach its minimum?":"What is the minimum value of "+f+"("+X+")?"),
    x:"The vertex is at "+X+" = "+MINUS+V("b")+"/(2"+V("a")+") = "+N(hh)+". Then "+f+"("+N(hh)+") = "+PN(hh)+SUP(2)+TERM(b,"",false)+"("+N(hh)+")"+TERM(c,"",false)+" = "+N(mn)+". So the minimum is "+N(mn)+" at "+X+" = "+N(hh)+". (Completed square: "+f+"("+X+") = ("+POLY([[1,X],[-hh,""]])+")"+SUP(2)+TERM(mn,"",false)+".)",
    t:askX?"The question asks where (the "+X+"-value), not the minimum value itself.":"The minimum value is "+f+" at the vertex, not the "+X+"-coordinate of the vertex.",
    des:"Graph it and tap the vertex: ("+N(hh)+", "+N(mn)+")."};
  if(R()<0.35){it2.spr={vals:[ans2]};return it2;}
  return withMC(R,it2,NO(ans2),askX?[NO(-hh),NO(mn),NO(b)]:[NO(c),NO(hh),NO(c+b*b/4),NO(-mn)],true,nearFill(R,ans2));
});
DEF("adv.exp","adv","Nonlinear functions",[1,2],function(R,lv){
  if(lv<=1){
    var a=RI(R,2,9),b=PK(R,[2,3,4,5]),k=PK(R,[3,4]);while(a*Math.pow(b,k)>50000)k--;

/* ---------- Rating ---------- */
function pCorrect(r,lv,mc){var c=mc?0.25:0;var L=1/(1+Math.pow(10,(QDIFF[lv]-r)/SIGMA));return c+(1-c)*L;}
/* Placement: for a domain's first PLACE_N answers the rating is the most likely ability given every

function placeLeft(S,d){var x=S.dx[d];return x.cal?0:Math.max(0,PLACE_N-x.n);}
/* Posterior mean of ability on a 4-point grid (EAP scoring). Smoother than the single most likely value. */
function placeEst(hist){

function diffWeights(r){var pe=clamp((600-r)/300,0.05,0.6),ph=clamp((r-500)/250,0.05,0.7),pm=Math.max(0.2,1-pe-ph),s=pe+pm+ph;return[pe/s,pm/s,ph/s];}

function genFor(d,lv,rnd){
  var ids=Object.keys(MGEN).filter(function(k){return MGEN[k].d===d&&MGEN[k].lvs.indexOf(lv)>=0&&k!=="sec.bound";});
  if(!ids.length)ids=Object.keys(MGEN).filter(function(k){return MGEN[k].d===d&&k!=="sec.bound";});
  for(var t=0;t<12;t++){var id=ids[Math.floor(rnd()*ids.length)];var q=fromGen(id,lv,1+Math.floor(rnd()*2147483646));if(q)return q;}
  return null;
}
function pickBank(S,d,lv,rnd,recent,skf){
  var pool=RW_BANK.filter(function(it){return it.d===d&&(!skf||it.sk===skf)&&!S.flagged[it.id]&&recent.indexOf("b:"+it.id)<0;});
  if(!pool.length)pool=RW_BANK.filter(function(it){return it.d===d&&(!skf||it.sk===skf)&&!S.flagged[it.id];});
  if(!pool.length)return null;
  /* Unseen questions first: at the asked level, then one step harder, then one step easier. */
  var at=function(L){return pool.filter(function(it){return it.lv===L;});},unseen=function(a){return a.filter(function(it){return!(S.seen[it.id]>0);});};
  var tries=[at(lv),at(lv+1),at(lv-1)];
  for(var i=0;i<tries.length;i++){var f=unseen(tries[i]);if(f.length)return f[Math.floor(rnd()*f.length)];}
  var ex=at(lv);if(ex.length>=2)pool=ex;

}
function buildFor(S,d,lv,rnd,recent){

    if(rnd()<0.1){var st=MATH_STATIC.filter(function(it){return it.d===d&&!S.flagged[it.id]&&recent.indexOf("s:"+it.id)<0;});if(st.length){var ex=st.filter(function(it){return it.lv===lv;});q=fromStatic(S,(ex.length?ex:st)[Math.floor(rnd()*(ex.length?ex:st).length)],rnd);}}
    return q||genFor(d,lv,rnd);

  var b=pickBank(S,d,lv,rnd,recent);if(b)return fromBank(S,b,rnd);

/* ---------- Answers ---------- */
function parseNum(s){
  s=String(s==null?"":s).trim().replace(/−/g,"-").replace(/,/g,"").replace(/\s+/g,"");
  if(!s)return NaN;
  if(/^-?(\d+\.?\d*|\.\d+)\/-?(\d+\.?\d*|\.\d+)$/.test(s)){var p=s.split("/"),d=parseFloat(p[1]);return d===0?NaN:parseFloat(p[0])/d;}
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(s))return parseFloat(s);

}
function sprMatch(resp,vals){
  var v=parseNum(resp);if(!isFinite(v))return false;
  var dec=(String(resp).split(".")[1]||"").replace(/[^\d]/g,"").length;
  return vals.some(function(a){if(Math.abs(v-a)<1e-9)return true;return !Number.isInteger(a)&&dec>=3&&Math.abs(v-a)<=0.0006;});
}
function checkAnswer(q,resp){if(q.spr)return sprMatch(resp,q.spr.vals);return resp===q.correct;}

/* ---------- Economy ---------- */
function achCount(S){return Object.keys(S.ach).length;}
function hasPerk(S,id){return S.insight>=PERK_BY[id].at;}

function genCost(S,id,n){var G=GEN_BY[id],own=S.gen[id],r=1.15,disc=hasPerk(S,"roots")?0.9:1;return Math.ceil(G.base*ECO.genCost*Math.pow(r,own)*(Math.pow(r,n)-1)/(r-1)*disc);}

function addSparks(S,x){if(!(x>0))return;S.sparks+=x;S.runSparks+=x;S.lifeSparks+=x;S.today.sparks=(S.today.sparks||0)+x;}
function tick(S,dtSec,active){if(active&&dtSec>0){var g=idleRate(S)*dtSec;addSparks(S,g);return g;}return 0;}

/* ---------- Blind spots ---------- */
function updateSpots(S,q,correct,now){
  var i=-1;for(var n=0;n<S.spots.length;n++){if(S.spots[n].k===q.key){i=n;break;}}
  if(!correct){
    if(i>=0){var s=S.spots[i];s.box=0;s.due=now+SPOT_INT[0];s.miss++;return"reset";}
    var ref=q.kind==="ai"?q.aiItem:q.ref;
    S.spots.push({k:q.key,kind:q.kind,ref:ref,d:q.d,sk:q.sk,box:0,due:now+SPOT_INT[0],miss:1,added:now});
    if(S.spots.length>300)S.spots.splice(0,S.spots.length-300);
    return"added";
  }
  if(i<0)return null;var sp=S.spots[i];if(sp.due>now)return null;
  sp.box++;if(sp.box>=3){S.spots.splice(i,1);S.stats.spotsCleared++;return"cleared";}
  sp.due=now+SPOT_INT[sp.box];return"advanced";
}

var HUB={rate:0.25,base:60,g:1.2,miles:[10,25,50],stage:1};

function hubCap(S,d){return 3+Math.round(47*connD(S,d)/connMaxD(d));}

function hubRate(S){var t=0;for(var i=0;i<DKEYS.length;i++)t+=hubOut(S,DKEYS[i]);return t;}

function setFresh(S,now){return{n:0,c:0,sp:0,run:0,best:0,log:"",conn0:conn(S),p0:proj(S).total,r0:DKEYS.map(function(d){return S.r[d];}),t0:now};}
function setRecord(S,correct,res,now){
  if(!S.set||typeof S.set.n!=="number")S.set=setFresh(S,now);
  var st=S.set;st.n++;st.sp+=res.gain;st.log=(st.log||"")+(correct?"1":"0");if(correct){st.c++;st.run++;if(st.run>st.best)st.best=st.run;}else st.run=0;

function loadLocal(){try{var raw=localStorage.getItem(LS);if(raw){var o=JSON.parse(raw);if(o&&o.r&&o.stats)return migrate(o,now());}}catch(e){}return null;}

function cloudPush(force){
  if(!CAP.ref)return Promise.resolve();
  if(CAP.busy){CAP.pending=true;return Promise.resolve();}
  CAP.busy=true;CAP.pending=false;
  return CAP.ref.get().then(function(snap){
    var d=snap&&snap.exists?snap.data():null;
    if(!force&&d&&(d.answered||0)>S.stats.answered){CAP.remote=d;remoteAheadToast();return;}
    return CAP.ref.set(cloudBody()).then(function(){CAP.cloudAt=now();CAP.cloud="on";});
  }).catch(function(e){var c=e&&e.code;if(c==="revoked"||c==="not_granted"||c==="invalid_argument"||c==="capability_disabled"||c==="capability_removed"){CAP.ref=null;CAP.cloud="off";}else CAP.cloud="error";})
  .then(function(){CAP.busy=false;renderSync();if(CAP.pending)scheduleCloud(4000);});
}

  var behind=function(front){c.globalCompositeOperation="lighter";orbPts.forEach(function(q){if((q[3]>0)!==front)return;dGlow(c,col,q[0],q[1],q[2]*3.2,0.5);c.fillStyle="#FFFFFF";c.fillRect(q[0]-0.6,q[1]-0.6,1.2,1.2);});c.globalCompositeOperation="source-over";};

  behind(false);

  if(S.gen.palace>0){c.strokeStyle=hexA(col,0.45);c.lineWidth=1.2;c.beginPath();for(i=0;i<=6;i++){var ha=t*0.25+i*Math.PI/3;c[i?"lineTo":"moveTo"](x+Math.cos(ha)*R*1.62,y+Math.sin(ha)*R*1.62*0.62);}c.stroke();}
  if(S.gen.perfect>0){c.globalCompositeOperation="lighter";c.strokeStyle=hexA("#FFE08A",0.35+0.2*Math.sin(t*2));c.lineWidth=3;c.beginPath();c.arc(x,y,R*2.55,Math.PI*1.05,Math.PI*1.95);c.stroke();c.globalCompositeOperation="source-over";}
  if(form==="universe"){
    var sg=c.createRadialGradient(x,y,0,x,y,R*1.25);sg.addColorStop(0,"#FFFDF1");sg.addColorStop(0.35,"#FFE08A");sg.addColorStop(0.7,"#FFB347");sg.addColorStop(1,"rgba(255,140,60,0)");
    c.globalCompositeOperation="lighter";for(i=0;i<14;i++){var ra=i*Math.PI/7+t*0.08,len=R*(1.6+0.35*Math.sin(t*1.7+i*2.1));c.strokeStyle=hexA("#FFC24D",0.16);c.lineWidth=2;c.beginPath();c.moveTo(x+Math.cos(ra)*R*0.9,y+Math.sin(ra)*R*0.9);c.lineTo(x+Math.cos(ra)*len,y+Math.sin(ra)*len);c.stroke();}c.globalCompositeOperation="source-over";
    c.fillStyle=sg;c.beginPath();c.arc(x,y,R*1.25,0,6.283);c.fill();
  }else if(form==="reactor"){
    c.fillStyle="#040C15";c.beginPath();c.arc(x,y,R,0,6.283);c.fill();
    var pg=c.createRadialGradient(x,y,0,x,y,R*0.95);pg.addColorStop(0,hexA(col,0.5));pg.addColorStop(1,hexA(col,0.02));c.fillStyle=pg;c.beginPath();c.arc(x,y,R*0.95,0,6.283);c.fill();
    [[1.0,3,0.9,[18,8]],[0.84,2,-1.4,[6,6]],[0.68,1.5,2.1,[2,5]]].forEach(function(rg){c.strokeStyle=hexA(col,0.85);c.lineWidth=rg[1];c.setLineDash(rg[3]);c.lineDashOffset=t*rg[2]*20;c.beginPath();c.arc(x,y,R*rg[0],0,6.283);c.stroke();});c.setLineDash([]);c.lineDashOffset=0;
    c.fillStyle="rgba(4,12,21,.72)";c.beginPath();c.arc(x,y,R*0.6,0,6.283);c.fill();

function updParts(c,dt,active,form){
  var rate=idleRate(S),want=reduced?0:(rate>0?(active?Math.min(26,3+5*Math.log10(1+rate)):1.2):0.5);
  ST.spawn+=want*dt;
  while(ST.spawn>=1){ST.spawn-=1;var tot=0,w={};DKEYS.forEach(function(d){w[d]=(1+hubLv(S,d))*(0.2+(ST.disp[d]-160)/600);tot+=w[d];});var x=Math.random()*tot,pick=DKEYS[0];for(var i=0;i<DKEYS.length;i++){x-=w[DKEYS[i]];if(x<=0){pick=DKEYS[i];break;}}
    ST.parts.push({d:pick,f:0,sp:1/(1.5+Math.random()*1.1),s:0.8+Math.random()*1.2});}
  if(ST.parts.length>160)ST.parts.splice(0,ST.parts.length-160);
  c.globalCompositeOperation="lighter";
  var keep=[];ST.parts.forEach(function(P){P.f+=dt*P.sp*(active?1:0.4);if(P.f>=1)return;keep.push(P);var pl=ST.paths[P.d];if(!pl)return;
    var q=along(pl,P.f),col=DOMAINS[P.d].color,a=Math.sin(P.f*Math.PI);
    if(form==="reactor"){var p=domPos(P.d),tw=clamp(ST.g.colW*0.26,6,17);if(q[1]<p.y-1)return;dGlow(c,"#FFFFFF",q[0]+Math.sin(P.f*20+P.s*9)*tw*0.25,q[1],2.4*P.s,0.35*a);return;}
    dGlow(c,col,q[0],q[1],5*P.s,0.55*a);c.fillStyle="rgba(255,255,255,"+(0.8*a).toFixed(2)+")";c.fillRect(q[0]-0.7,q[1]-0.7,1.4,1.4);});
  ST.parts=keep;c.globalCompositeOperation="source-over";
}
function drawPulses(c,tms,form){
  var keep=[];c.globalCompositeOperation="lighter";
  ST.pulses.forEach(function(P){var k=(tms-P.t0)/P.dur;if(k>=1){
      ST.fx.push({type:"ring",x:P.x,y:P.y,col:P.col,t0:tms,dur:700,r0:3,r1:P.star?44:22,w:P.star?2.5:1.6});
      if(P.star){for(var i=0;i<14;i++){var a=Math.random()*6.283,v=30+Math.random()*50;ST.fx.push({type:"spark",x:P.x,y:P.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,col:P.col,t0:tms,dur:700+Math.random()*300});}
        ST.fx.push({type:"text",x:P.x,y:P.y-16,txt:"NEW NODE",col:P.col,t0:tms,dur:1500});}
      return;}
    keep.push(P);var pl=ST.paths[P.d];if(!pl)return;var hp=domPos(P.d),split=0.78,q;
    if(k<split){q=along(pl,k/split);}else{var u=(k-split)/(1-split);q=[hp.x+(P.x-hp.x)*u,hp.y+(P.y-hp.y)*u];}
    for(var j=0;j<6;j++){var kk=Math.max(0,k-j*0.018),qq=kk<split?along(pl,kk/split):[hp.x+(P.x-hp.x)*((kk-split)/(1-split)),hp.y+(P.y-hp.y)*((kk-split)/(1-split))];dGlow(c,P.crit?"#FFE08A":P.col,qq[0],qq[1],(9-j)*1.4,0.7-j*0.1);}
    c.fillStyle="#FFFFFF";c.beginPath();c.arc(q[0],q[1],2.6,0,6.283);c.fill();});
  ST.pulses=keep;c.globalCompositeOperation="source-over";
}
function drawFx(c,tms){
  var keep=[],g=ST.g;
  ST.fx.forEach(function(F){var k=(tms-F.t0)/F.dur;if(k>=1||k<0){if(k<0)keep.push(F);return;}keep.push(F);var e=1-Math.pow(1-k,3);
    if(F.type==="ring"){c.strokeStyle=hexA(F.col,(1-k)*0.9);c.lineWidth=F.w||2;c.beginPath();c.arc(F.x,F.y,F.r0+(F.r1-F.r0)*e,0,6.283);c.stroke();}
    else if(F.type==="spark"){var sx=F.x+F.vx*e,sy=F.y+F.vy*e;c.globalCompositeOperation="lighter";dGlow(c,F.col,sx,sy,5,1-k);c.globalCompositeOperation="source-over";}
    else if(F.type==="text"){c.font='700 11px "Chakra Petch", system-ui, sans-serif';c.textAlign="center";c.fillStyle=hexA(F.col,Math.min(1,(1-k)*2));c.fillText(F.txt,F.x,F.y-14*e);c.textAlign="left";}
    else if(F.type==="bolt"){var r=srand(F.seed+Math.floor(k*6));c.strokeStyle=hexA(F.col,1-k);c.lineWidth=1.6;c.beginPath();c.moveTo(F.x0,F.y0);for(var i=1;i<=8;i++){var u=i/8,jx=(r()-0.5)*18*(i<8?1:0),jy=(r()-0.5)*10*(i<8?1:0);c.lineTo(F.x0+(F.x1-F.x0)*u+jx,F.y0+(F.y1-F.y0)*u+jy);}c.stroke();}
    else if(F.type==="shock"){var y=yOf(F.score);c.strokeStyle=hexA(F.col,(1-k)*0.9);c.lineWidth=2;var half=(g.w-g.L-g.R)*e/2,mid=(g.L+g.w-g.R)/2;c.beginPath();c.moveTo(mid-half,y);c.lineTo(mid+half,y);c.stroke();}
    else if(F.type==="beam"){c.globalCompositeOperation="lighter";c.strokeStyle=hexA(F.col,(1-k)*0.9);c.lineWidth=3*(1-k)+1;c.beginPath();c.moveTo(F.x0,F.y0);c.lineTo(F.x0+(F.x1-F.x0)*Math.min(1,k*3),F.y0+(F.y1-F.y0)*Math.min(1,k*3));c.stroke();c.globalCompositeOperation="source-over";}
  });
  ST.fx=keep;
}

function showTip(hit,pin){
  var el=$("etip"),key=hit.h.type+(hit.h.d||"")+(hit.h.sk||"");
  if(key!==ST.tipKey||pin){el.innerHTML=tipHTML(hit.h);ST.tipKey=key;updateAfford();}
  el.hidden=false;var w=el.offsetWidth,h=el.offsetHeight,x=hit.h.x+16,y=hit.h.y-h/2;
  if(x+w>ST.w-8)x=hit.h.x-16-w;y=clamp(y,8,ST.h-h-8);el.style.left=x+"px";el.style.top=y+"px";
  if(hit.h.type==="node"&&hit.h.d)el.style.setProperty("--dc",DOMAINS[hit.h.d].color);
  ST.pin=pin?hit:null;clearTimeout(ST.tipHide);
}
function hideTip(force){if(ST.pin&&!force)return;ST.pin=null;ST.tipKey="";var el=$("etip");if(el)el.hidden=true;}
function wireStage(){
  var cv=$("engineCv"),tip=$("etip");
  cv.addEventListener("mouseenter",function(){ST.hovering=true;});
  cv.addEventListener("mousemove",function(ev){ST.hovering=true;if(ST.pin)return;var hit=stageHit(ev);cv.classList.toggle("pointer",!!hit);if(hit)showTip(hit,false);else{clearTimeout(ST.tipHide);ST.tipHide=setTimeout(function(){if(!tip.matches(":hover"))hideTip();},160);}});
  cv.addEventListener("mouseleave",function(){ST.hovering=false;clearTimeout(ST.tipHide);ST.tipHide=setTimeout(function(){if(!tip.matches(":hover"))hideTip();},220);});
  tip.addEventListener("mouseleave",function(){if(!ST.pin)hideTip();});
  cv.addEventListener("click",function(ev){var hit=stageHit(ev);if(!hit){hideTip(true);return;}
    if(hit.h.type==="core"&&!isMobile()){setTab("evolution");return;}
    showTip(hit,true);});
}

function qPlain(q,withKey,resp,ok){

  p.push("Question: "+toPlain(q.stem));
  if(q.choices)p.push("Choices:\n"+q.choices.map(function(c,i){return"ABCD"[i]+") "+toPlain(c);}).join("\n"));
