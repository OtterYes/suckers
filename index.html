  var n=chestCount(S),b=$("chestBtn");b.innerHTML=CHEST_I+(n?'<span class="dot">'+n+"</span>":"");b.classList.toggle("has",n>0);b.setAttribute("aria-label",n?n+" chests to open":"Chests");
}
function bossBannerHTML(){
  var B=S.boss,hearts="";for(var i=0;i<3;i++)hearts+='<span style="color:'+(i<B.hearts?"#FF5A4F":"#3A4658")+'">'+HEART+"</span>";
  return'<div class="boss" id="bossBox" style="--dc:'+DOMAINS[B.d].color+'">'+sigilSVG(B.d)+'<div><div class="boss-name">'+esc(BOSSES[B.d].name)+"<span>Tier "+B.tier+'</span></div><div class="boss-taunt">'+esc(BOSSES[B.d].taunt)+'</div><div class="hp"><i id="hpFill" style="width:'+lastHp.toFixed(1)+'%"></i><span>'+B.hp+" / "+B.max+' HP</span></div></div><div class="boss-side"><div class="hearts" role="img" aria-label="'+B.hearts+' lives left">'+hearts+'</div><button type="button" class="linkbtn dim" data-act="bossFlee">Flee</button></div></div>';
}
function bossGo(d){if(S.g){toast("Finish your Gauntlet first","One fight at a time.","pink");return;}bossStart(S,d,now());saveAll();UI.tab="network";applyViews();nextQ();renderFocus();renderNav(true);if(isMobile())window.scrollTo(0,0);toast(BOSSES[d].name,BOSSES[d].taunt,"pink",null,3500);SND.bad();}
function bossFlee(){if(!S.boss)return;var n=BOSSES[S.boss.d].name;S.boss=null;saveAll();renderFocus();nextQ();renderNav(true);toast("You fled",n+" will be waiting. Same tier next time.","");}
function bossFx(bh,rect){
  var box=$("bossBox"),br=box?box.getBoundingClientRect():rect,x=br.left+br.width/2,y=br.top+br.height/2;
  if(bh.dmg){floatText(x,y,(bh.crit?"CRIT ":"")+"−"+bh.dmg+" HP",bh.crit?"crit":"");if(box&&!reduced){box.classList.remove("hit");void box.offsetWidth;box.classList.add("hit");}}
  else if(!bh.won){floatText(x,y,bh.lost?"no lives left":"the boss strikes","miss");}
  if(bh.won){SND.rank();burst(window.innerWidth/2,window.innerHeight/2,30);
    modal('<div class="promo" style="--rank:'+DOMAINS[bh.d].color+'"><div class="em" style="width:110px;height:110px">'+sigilSVG(bh.d).replace('class="sigil"','class="sigil" style="width:100%;height:100%"')+"</div><h2>Boss defeated</h2><p>"+esc(BOSSES[bh.d].name)+" (tier "+bh.tier+") is down. +"+fmt(bh.sparks)+" sparks and a "+RARITY[bh.chest].name+" chest. Tier "+(bh.tier+1)+' is waiting.</p><div class="mfoot" style="justify-content:center"><button type="button" class="btn primary" data-act="openChest" data-v="'+bh.chest+'">Open chest</button><button type="button" class="btn line" data-act="modalClose">See explanation</button></div></div>');
    (bh.quests||[]).forEach(questToast);}
  if(bh.lost){modal("<h2>Defeated</h2><p>"+esc(BOSSES[bh.d].name)+" wins this round. You still earned +"+fmt(bh.sparks)+' sparks, and your misses are now blind spots, which is how you beat it next time.</p><div class="mfoot"><button type="button" class="btn primary" data-act="modalClose">See explanation</button><button type="button" class="btn line" data-act="bossGo" data-v="'+bh.d+'">Rematch</button></div>');}
  renderNav(true);
}
function questToast(q){if(q.id==="weekly"){toast("Weekly complete","100 right this week.","mint",'<button type="button" class="btn primary sm" data-act="claimW">Claim legendary chest</button>',9000);return;}
  var i=S.quests.list.indexOf(q);toast("Quest complete",questLabel(q)+".","mint",i>=0?'<button type="button" class="btn primary sm" data-act="claimQ" data-i="'+i+'">Claim chest</button>':null,9000);}
function boostsHTML(){var a=[];["dbl","crit","xp"].forEach(function(k){if(S.boosts[k]>0)a.push(BOOSTS[k].name+" · "+S.boosts[k]+" left");});if(S.boosts.shield>0)a.push("Streak Shield ×"+S.boosts.shield);
  return a.length?'<p class="pnote" style="margin:12px 0 6px">Active boosts</p><div class="boostrow">'+a.map(function(x){return'<span class="boost">'+esc(x)+"</span>";}).join("")+"</div>":"";}
function invHTML(){return'<div class="inv">'+["c","r","e","l"].map(function(r){var n=S.chests[r];return'<div class="invc'+(n?"":" none")+'" style="--rc:'+RARITY[r].color+'">'+chestSVG(r)+'<div class="n">'+RARITY[r].name+" ×"+n+'</div><button type="button" class="btn primary" data-act="openChest" data-v="'+r+'"'+(n?"":" disabled")+">Open</button></div>";}).join("")+"</div>";}
function showChests(){modal("<h2>Chests</h2>"+(chestCount(S)?"":"<p>No chests right now. They drop from right answers (more on streaks and hard questions), level-ups, quests, perfect sets, evolutions, and bosses.</p>")+invHTML()+boostsHTML()+'<div class="mfoot"><button type="button" class="btn line" data-act="modalClose">Close</button></div>');}
function bestChest(){var o=["l","e","r","c"];for(var i=0;i<4;i++)if(S.chests[o[i]]>0)return o[i];return null;}
function lootCard(o,i){var rc=RARITY[o.rar].color,k,b,s,nw="";
  if(o.t==="sparks"){k="Sparks";b="+"+fmt(o.sparks);s="Straight to your bank.";}
  else if(o.t==="boost"){k="Boost";b=BOOSTS[o.k].name;s=BOOSTS[o.k].desc+".";}
  else if(o.t==="relic"){k=RARITY[o.rar].name+" relic";b=o.relic.name;s=relicEffect(o.relic,o.lv)+" · Lv "+o.lv+"/5";nw='<span class="new">'+(o.isNew?"NEW":"LV UP")+"</span>";}
  else{k="Maxed relic";b=o.relic.name;s="Already level 5. Converted to +"+fmt(o.sparks)+" sparks.";}
  return'<div class="lcard" style="--rc:'+rc+";animation-delay:"+(i*0.14).toFixed(2)+'s">'+nw+'<div class="lk">'+esc(k)+"</div><b>"+esc(b)+"</b><span>"+esc(s)+"</span></div>";}
function openChestUI(r){
  if(!r||!S.chests[r])return;var rc=RARITY[r].color;if(CAP.packCtl)return;
  var after=UI.afterModal;UI.afterModal=null;
  modal('<div class="chest-stage" id="cstage" style="--rc:'+rc+'"><div class="chest-title">'+RARITY[r].name+" chest</div>"+chestSVG(r)+"</div>",true);
  var st=$("cstage");if(!reduced)st.classList.add("opening");SND.tone(220,0.5,"sawtooth",0.02);
  var out=openChest(S,r,rnd),na=checkAch(S,now());saveAll();
  setTimeout(function(){
    var left=chestCount(S),nx=bestChest();UI.afterModal=after;
    modal('<div class="chest-stage" style="--rc:'+rc+'"><div class="chest-title">'+RARITY[r].name+' loot</div><div class="loot">'+out.map(lootCard).join("")+'</div></div><div class="mfoot" style="justify-content:center">'+(left?'<button type="button" class="btn primary" data-act="openChest" data-v="'+nx+'">Open next ('+left+" left)</button>":"")+'<button type="button" class="btn '+(left?"line":"primary")+'" data-act="modalClose">Done</button></div>');
    var base={c:523.25,r:587.33,e:659.25,l:783.99};out.forEach(function(o,i){setTimeout(function(){SND.tone(base[o.rar]*Math.pow(2,i/12*2),0.22,"triangle",0.06);},i*140);});
    burst(window.innerWidth/2,window.innerHeight/2,r==="l"?40:r==="e"?26:14);
    na.forEach(function(a){toast("Trophy · "+a[1],a[2]+" +2% sparks forever.","");});
    renderHUD();renderPanel();
  },reduced?60:780);
}
function lvlModal(L){modal('<div class="promo lvlup" style="--rank:#5DD6A8"><p class="pnote">Level up</p><div class="big">'+L.lv+"</div><p>You earned a "+RARITY[L.chest].name+" chest and +"+fmt(L.sparks)+' sparks. Bigger chests every 5 levels.</p><div class="mfoot" style="justify-content:center"><button type="button" class="btn primary" data-act="openChest" data-v="'+L.chest+'">Open it</button><button type="button" class="btn line" data-act="modalClose">Later</button></div></div>');SND.rank();}
function lootAfter(res,rect){
  var x=rect.left+rect.width/2,y=rect.top;
  if(res.shielded)toast("Streak Shield","Your streak of "+S.streak+" survived that miss.","mint");
  if(res.chest){setTimeout(function(){floatText(x,y-34,RARITY[res.chest].name.toUpperCase()+" CHEST!","crit");SND.tone(1046.5,0.3,"triangle",0.06);SND.tone(1318.5,0.35,"triangle",0.05,0.1);},250);bump($("chestBtn"));toast(RARITY[res.chest].name+" chest dropped","Open it from the chest button up top.","");}
  (res.levelUps||[]).forEach(function(L){if(L.lv%5===0&&!modalOpen())lvlModal(L);else toast("Level "+L.lv,"+"+fmt(L.sparks)+" sparks and a "+RARITY[L.chest].name+" chest.","mint");});
  if(res.levelUps)bump($("lvlChip"));
  (res.quests||[]).forEach(questToast);
  if(res.set&&res.set.chest)toast("Perfect set","10 for 10. A Rare chest is yours.","mint");
  renderLoot();UI.railSig="";renderRail();
}
function relicsHTML(){var found=Object.keys(S.relics).length,h='<div class="sec-h"><h3>Relics</h3><small>'+found+"/"+RELICS.length+' found</small></div><p class="pnote">Permanent bonuses that drop from chests. Duplicates level a relic up, to level 5.</p><div class="relics">';
  RELICS.forEach(function(R){var lv=relicLv(S,R.id),p="";for(var i=0;i<5;i++)p+='<i class="'+(i<lv?"on":"")+'"></i>';h+='<div class="relic'+(lv?"":" off")+'" style="--rc:'+RARITY[R.r].color+'"><span class="rl">'+RARITY[R.r].name+(lv?" · Lv "+lv:"")+"</span><b>"+(lv?esc(R.name):"???")+"</b><span>"+(lv?esc(relicEffect(R,lv)):"Not found yet")+'</span><div class="pips5">'+p+"</div></div>";});
  return h+"</div>";}

/* ---------- render all + loop ---------- */
function renderAll(){UI.railSig="";UI.evoSig="";renderHUD();renderFocus();renderPackBtn();renderConsole();applyViews();}
var lastT=0,lastSave=0,lastSlow=0,lastDay=0;
function loop(t){
  var raw=lastT?Math.min(1,(t-lastT)/1000):0,dt=Math.min(0.1,raw);lastT=t;var n=now();
  var vis=document.visibilityState==="visible",active=vis&&(n-S.lastInteract)<activeWindow(S);
  tick(S,raw,active);renderSparks(active,raw);
  if(cur&&Q&&!S.g){var el=$("qTimer");if(el){var ms=(Q.answered?Q.answeredAt:n)-Q.shownAt,pace=PACE[DOMAINS[cur.d].sec]*1000,txt=fmtTime(ms)+" / "+fmtTime(pace);if(el.textContent!==txt){el.textContent=txt;el.classList.toggle("over",ms>pace);}}}
  if(S.g&&!S.g.pending){var left=S.g.ends-n;if(left<=0){gSubmit(true);}else{var gt=$("gTimer");if(gt){var tt=fmtTime(left);if(gt.textContent!==tt){gt.textContent=tt;gt.classList.toggle("low",left<60000);}}}}
  if(UI.confirm&&n-UI.confirmT>5000){var was=UI.confirm;UI.confirm=null;if(was==="sleep")renderPanel();else if(was==="gsubmit")renderConsole();}
  if(t-lastSlow>250){lastSlow=t;updateAfford();renderNav();renderRail();renderEvoBar();if(n-lastDay>30000){lastDay=n;rollDay(S,n);}}
  if(n-lastSave>10000){lastSave=n;saveLocal();}
  if(stageOn()){
    /* Full frame rate only while something moves; the ambient engine is fine at 30fps, and at 10 behind a dialog. */
    var busy=ST.pulses.length||ST.fx.length||ST.flash>0||ST.fade<1||ST.hovering,gap=modalOpen()?100:busy?0:33;
    if(t-ST.lastDraw>=gap){stageFrame(t,Math.min(0.1,(t-(ST.lastDraw||t))/1000),active);ST.lastDraw=t;}
  }
  requestAnimationFrame(loop);
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");
  if(!b){if(e.target===$("modal")&&!$("modal").dataset.lock)closeModal();return;}
  var act=b.getAttribute("data-act"),v=b.getAttribute("data-v"),i=+b.getAttribute("data-i");
  switch(act){
   case"pick":pick(i);break;case"strike":strike(i);break;case"check":check();break;case"next":advance();break;case"nextSet":nextQ();break;
   case"ask":askClaude();break;case"report":report();break;
   case"tab":closeModal();setTab(v);break;
   case"form":if(formOpen(S,v)){S.form=v;saveLocal();applyViews();renderHUD();renderConsole();}break;
   case"profile":showProfile(v);break;
   case"scrollTo":var tg=$(v);if(tg)tg.scrollIntoView({block:"start",behavior:reduced?"auto":"smooth"});break;
   case"buyUp":buyUpA(v,b);break;case"buyGen":buyGenA(v,b);break;case"buyHub":buyHubA(v,b);break;
   case"buyN":S.buyN=v==="max"?"max":+v;renderPanel();saveLocal();break;
   case"sleep":sleepA();break;
   case"sound":S.settings.sound=!S.settings.sound;SND.wake();renderHUD();saveLocal();if(modalOpen()){var sb=$("modalCard").querySelector('[data-act="sound"]');if(sb)sb.textContent=S.settings.sound?"On":"Off";}break;
   case"settings":showSettings();break;
   case"chests":showChests();break;case"openChest":openChestUI(v);break;
   case"claimQ":var cq=claimQuest(S,i);if(cq){SND.buy();toast("Quest claimed","+Rare chest"+(cq.bonus?", plus an Epic chest for clearing all three.":"."),"mint");checkAch(S,now()).forEach(function(a){toast("Trophy · "+a[1],a[2]+" +2% sparks forever.","");});UI.railSig="";renderRail();renderLoot();saveAll();if(b.closest(".toast"))b.closest(".toast").remove();if(modalOpen()&&$("pfProj"))showProfile();}break;
   case"claimW":if(claimWeekly(S)){SND.rank();toast("Weekly claimed","+Legendary chest.","mint");UI.railSig="";renderRail();renderLoot();saveAll();if(b.closest(".toast"))b.closest(".toast").remove();if(modalOpen()&&$("pfProj"))showProfile();}break;
   case"bossGo":closeModal();bossGo(v);break;case"bossFlee":bossFlee();break;
   case"focusD":S.focus=v;saveLocal();hideTip(true);UI.tab="network";applyViews();nextQ();if(isMobile())window.scrollTo(0,0);toast("Focus",v==="spots"?"Reviewing blind spots.":"Training "+DOMAINS[v].name+".","mint",null,2200);break;
   case"focusSk":var sf=skFocus("sk:"+v);if(sf){S.focus="sk:"+v;saveLocal();hideTip(true);UI.tab="network";applyViews();nextQ();if(isMobile())window.scrollTo(0,0);toast("Focus","Training "+sf.sk+".","mint",null,2200);}break;
   case"pack":showPackModal();break;case"packgo":openPack();break;
   case"packstop":if(CAP.packCtl){try{CAP.packCtl.abort();}catch(x){}}break;
   case"modalClose":closeModal();break;
   case"welcomeGo":S.welcomed=true;S.seenV3=true;saveLocal();closeModal();SND.wake();break;
   case"gstart":gStart(v);break;case"gm2":gM2();break;case"gsubmit":gSubmit(false);break;
   case"gdone":UI.gResult=null;renderConsole();if(!Q||Q.answered)nextQ();break;
   case"gjump":gTime();S.g.idx=i;UI.confirm=null;renderConsole();break;
   case"gprev":if(S.g.idx>0){gTime();S.g.idx--;renderConsole();}break;
   case"gnext":if(S.g.idx<S.g.qs.length-1){gTime();S.g.idx++;renderConsole();}break;
   case"gflag":S.g.flag[S.g.idx]=!S.g.flag[S.g.idx];renderConsole();break;
   case"gpick":S.g.resp[S.g.idx]=i;if(S.g.strike[S.g.idx].length===4)S.g.strike[S.g.idx][i]=false;renderConsole();break;
   case"gstrike":var ar=S.g.strike[S.g.idx];if(ar.length!==4){ar=S.g.strike[S.g.idx]=[false,false,false,false];}ar[i]=!ar[i];if(ar[i]&&S.g.resp[S.g.idx]===i)S.g.resp[S.g.idx]=null;renderConsole();break;
   case"loadRemote":if(CAP.remote){try{adopt(JSON.parse(CAP.remote.json),"Loaded your newer progress.");CAP.remote=null;}catch(x){}}break;
   case"baseline":var bs=Math.round((+$("baseScore").value)/10)*10,bl=String($("baseLabel").value||"").trim().slice(0,30);if(!(bs>=320&&bs<=1520)){toast("Check the score","PSAT totals run from 320 to 1520.","pink");break;}S.baseline={total:bs,label:bl||"Last PSAT"};saveAll();renderHUD();toast("Marker saved",S.baseline.label+" · "+bs,"mint");break;
   case"recal":var rw=+$("recRW").value,m=+$("recM").value;if(!(rw>=160&&rw<=760&&m>=160&&m<=760)){toast("Check the scores","Section scores run from 160 to 760.","pink");break;}
     rw=Math.round(rw/10)*10;m=Math.round(m/10)*10;var dRW=rw-secRaw(S,RW_KEYS),dM=m-secRaw(S,M_KEYS);RW_KEYS.forEach(function(d){S.r[d]=clamp(S.r[d]+dRW,160,760);});M_KEYS.forEach(function(d){S.r[d]=clamp(S.r[d]+dM,160,760);});
     DKEYS.forEach(function(d){S.dx[d].cal=true;S.dx[d].pl=null;});
     var pr=proj(S);if(pr.total>S.peak)S.peak=pr.total;saveAll();renderAll();toast("Rating updated","Projected "+pr.total+" ("+pr.rw+" RW, "+pr.m+" Math).","mint");break;
   case"export":var ta=$("exportTxt");ta.value=exportCode();ta.hidden=false;$("copyRow").hidden=false;ta.select();break;
   case"copy":var tx=$("exportTxt");try{navigator.clipboard.writeText(tx.value).then(function(){toast("Copied","Backup code copied.","mint");},function(){tx.select();toast("Copy it manually","Your browser blocked copying. The code is selected.","");});}catch(x){tx.select();}break;
   case"import":try{var o=importCode($("importTxt").value);closeModal();adopt(o,"Backup restored.");scheduleCloud(1000);}catch(x){toast("That code didn’t work","Paste the whole code, starting with G1520:","pink");}break;
   case"reset":if(($("resetTxt").value||"").trim()!=="RESET"){toast("Not reset","Type RESET in the box to confirm.","pink");break;}
     S=newState(now());S.welcomed=true;S.seenV3=true;shownSparks=0;ST.disp={};ST.parts=[];ST.pulses=[];ST.fx=[];closeModal();saveLocal();if(CAP.ref)cloudPush(true);stageLayout();renderAll();nextQ();toast("Fresh start","Back to 320. Climb again.","pink");break;
  }
});
document.addEventListener("change",function(e){if(e.target&&e.target.id==="focusSel"){S.focus=e.target.value;saveLocal();if(Q&&!Q.answered&&!UI.showSet)nextQ();else renderFocus();}});
document.addEventListener("keydown",function(e){
  if(S)S.lastInteract=now();SND.wake();
  if(modalOpen()){if(e.key==="Escape"&&!$("modal").dataset.lock)closeModal();return;}
  if(e.key==="Escape"){if(ST.pin){hideTip(true);return;}if(UI.tab!=="network"&&!isMobile()){setTab("network");return;}}
  var tag=(e.target&&e.target.tagName||"").toLowerCase();
  if(tag==="button"&&(e.key==="Enter"||e.key===" "))return;
  if(e.key==="Enter"&&e.target&&e.target.classList&&e.target.classList.contains("drow")){e.target.click();return;}
  var inInput=tag==="input"||tag==="textarea"||tag==="select";
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var k=(e.key||"").toLowerCase(),map={a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
  if(isMobile()&&UI.tab!=="network")return;
  if(!S.g&&!UI.gResult&&cur){
    if(e.key==="Enter"){if(UI.showSet||Q.answered){advance();e.preventDefault();}else if(canCheck()){check();e.preventDefault();}return;}
    if(inInput)return;if(k in map&&!cur.spr&&!Q.answered&&!UI.showSet){pick(map[k]);e.preventDefault();}
  }else if(S.g&&!S.g.pending&&!UI.gResult){
    if(inInput)return;var G=S.g;
    if(e.key==="ArrowRight"&&G.idx<G.qs.length-1){gTime();G.idx++;renderConsole();}
    else if(e.key==="ArrowLeft"&&G.idx>0){gTime();G.idx--;renderConsole();}
    else if(k in map&&!G.qs[G.idx].spr){G.resp[G.idx]=map[k];renderConsole();}
    else if(k==="f"){G.flag[G.idx]=!G.flag[G.idx];renderConsole();}
  }
});
["pointerdown","wheel","touchstart"].forEach(function(ev){document.addEventListener(ev,function(){if(S)S.lastInteract=now();if(ev!=="wheel")SND.wake();},{passive:true});});
document.addEventListener("visibilitychange",function(){
  if(!S)return;
  if(document.visibilityState==="hidden"){hiddenAt=now();saveLocal();if(CAP.ref){clearTimeout(CAP.timer);cloudPush(false);}}
  else if(hiddenAt){var away=now()-hiddenAt;if(away>120000){var keep=S.lastSeen;S.lastSeen=hiddenAt;var off=offlineGain(S,now());S.lastSeen=keep;if(off&&off.gain>=1){addSparks(S,off.gain);toast("While you were away","Your engine earned +"+fmt(off.gain)+" sparks at "+Math.round(off.pct*100)+"% speed.","");}}hiddenAt=0;S.lastInteract=now();rollDay(S,now());renderHUD();renderFocus();}
});
var rzT=0;window.addEventListener("resize",function(){clearTimeout(rzT);rzT=setTimeout(function(){stageLayout();hideTip(true);},80);});

/* ---------- boot ---------- */
function start(hot){
  var t=now();
  S=(hot&&hot.S&&hot.S.r)?migrate(hot.S,t):(loadLocal()||newState(t));
  var fresh=!S.welcomed,off=offlineGain(S,t);if(off)addSparks(S,off.gain);
  S.lastSeen=t;S.lastInteract=t;shownSparks=S.sparks;rollDay(S,t);
  if(S.g&&!S.g.pending&&t>=S.g.ends){var r=gauntFinishModule(S,t,rnd);if(r.stage==="done")UI.gResult=r;}
  if(S.g&&!S.g.pending)S.g.shownAt=t;
  evoCheck(S,t);
  wireStage();renderAll();nextQ();saveLocal();stageLayout();
  if(fresh)showWelcome();
  else if(!S.seenV3){S.seenV3=true;saveLocal();showWhatsNew();}
  else if(off&&off.gain>=1)showOffline(off);
  if(S.evo.stage>S.evo.seen){if(modalOpen())UI.afterModal=maybeEvolveModal;else maybeEvolveModal();}
  try{if(window.claude&&window.claude.hot&&typeof window.claude.hot.snapshot==="function")window.claude.hot.snapshot(function(){return{S:S};});}catch(e){}
  requestAnimationFrame(loop);initCaps();
}
try{var hot=window.claude&&window.claude.hot;if(hot&&typeof hot.ready==="function")hot.ready(start);else start(hot&&hot.data?hot.data:{});}catch(e){start({});}
})();

</script>
