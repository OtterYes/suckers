}
function ensureMissions() {
  while (S.missions.length < 3) S.missions.push(newMission(S.missions.map((m) => m.type)));
}
function mission(ev, val) {
  let changed = false;
  for (const m of S.missions) {
    if (m.done) continue;
    switch (m.type) {
      case "correct": if (ev === "correct" && val.dom === m.dom) m.prog++; break;
      case "mixed": if (ev === "correct" && S.focus === "mix") m.prog++; break;
      case "hard": if (ev === "correct" && val.tier === 3) m.prog++; break;
      case "combo": if (ev === "combo") m.prog = Math.max(m.prog, val); break;
      case "buy": if (ev === "buy") m.prog += val; break;
      case "review": if (ev === "review") m.prog += val; break;
      case "earn": if (ev === "earn") m.prog += val; break;
    }
    if (m.prog >= m.target) { m.done = true; changed = true; }
  }
  if (changed) {
    const done = S.missions.filter((m) => m.done);
    for (const m of done) {
      earn(m.reward, "mission"); S.missionsDone++;
      toast("Mission complete", `${MISSION_TYPES[m.type].text(m)} · +${fmt(m.reward)} Data`);
      popText(`+${fmt(m.reward)} mission`, "txt");
    }
    S.missions = S.missions.filter((m) => !m.done);

    byId("dotMissions").hidden = false;
    if (ui.view === "missions") render();
  }
}
function checkAchievements() {
  for (const a of ACH) {

}

/* ---------- actions ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  AU.init();
  const act = t.dataset.act;
  switch (act) {
    case "view": {
      const v = t.dataset.view; if (v === "practice" && !cur) { startSession(); nextQuestion(); }
      if (ui.open && ui.view === v && (v !== "domain" || ui.arg === t.dataset.arg) && t.closest("#dock")) closePanel(); else openPanel(v, t.dataset.arg); break;
    }
    case "closePanel": closePanel(); break;
    case "mute": S.settings.muted = !S.settings.muted; AU.setMuted(S.settings.muted); syncMute(); save(); break;
    case "focus": {
      const dm = t.dataset.dom; S.focus = dm;
      if (cur && !cur.done && qstat(cur.q.id).n === 0 && (dm === "mix" || cur.q.d !== dm)) nextQuestion();
      render(); save(); break;
    }
    case "choose": if (cur && !cur.done) { answerCurrent(+t.dataset.i); render(); } break;
    case "submitSpr": submitSpr(); break;
    case "hint": useHint(); break;
    case "next": if (cur && cur.done) { if (session.n >= SESSION_LEN) { startSession(); } nextQuestion(); render(); } break;
    case "newSession": startSession(); nextQuestion(); render(); break;
    case "endSession": startSession(); nextQuestion(); render(); break;
    case "practiceDom": S.focus = t.dataset.dom; if (!cur || cur.done || cur.q.d !== S.focus) { if (!cur) startSession(); nextQuestion(); } openPanel("practice"); save(); break;
    case "qty": ui.qty = t.dataset.q === "max" ? "max" : +t.dataset.q; render(); break;
    case "buyMod": buyModule(t.dataset.dom, ui.view === "domain" ? 1 : ui.qty); break;
    case "buyB": buyBuilding(t.dataset.kind, ui.qty); break;
    case "buyR": buyResearch(t.dataset.id); break;
    case "buyP": buyPerk(t.dataset.id); break;
    case "publish": confirmPublish(); break;
    case "setting": {
      const k = t.dataset.k; S.settings[k] = !S.settings[k]; save();
      if (k === "muted") { AU.setMuted(S.settings.muted); syncMute(); }
      if (k === "low") scene3d && scene3d.setLow(S.settings.low);
      if (k === "labels") byId("labels").style.display = S.settings.labels ? "" : "none";
      render(); break;
    }
    case "export": {
      const code = exportSave();
      showModal(`<h2><small>Export</small>Your save code</h2><p class="small">Copy this string somewhere safe. Paste it into Import on another device.</p><textarea id="expTa" readonly>${esc(code)}</textarea>`, [{ label: "Copy", cls: "primary", act: "copy" }, { label: "Close", act: "close" }], (a) => {
        if (a === "copy") { const ta = byId("expTa"); ta.select(); try { navigator.clipboard && navigator.clipboard.writeText(ta.value); document.execCommand && document.execCommand("copy"); } catch (e) {} toast("Copied", "Save code copied to clipboard", "info"); }
      }); break;
    }
    case "import": {
      showModal(`<h2><small>Import</small>Paste a save code</h2><p class="small">This replaces the save in this browser.</p><textarea id="impTa" placeholder="Paste the code here"></textarea>`, [{ label: "Import", cls: "primary", act: "doImport" }, { label: "Cancel", act: "close" }], (a) => {
        if (a === "doImport") { if (importSave(byId("impTa").value)) { hideModal(); window.__resetting = true; location.reload(); } else toast("Import failed", "That code is not a valid ORBIT 1520 save.", "info"); return true; }
      }); break;
    }
    case "reset": {
      showModal(`<h2><small>Hard reset</small>Erase everything?</h2><p>This deletes your station, mastery, stars, and achievements in this browser. There is no undo. Export a save first if you might want it back.</p>`, [{ label: "Erase everything", cls: "danger", act: "doReset" }, { label: "Keep my save", cls: "primary", act: "close" }], (a) => {
        if (a === "doReset") { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} window.__resetting = true; location.reload(); }
      }); break;
    }
    case "modal": {
      const a = t.dataset.modal; if (a === "close") { hideModal(); break; }
      const gen = ui.modalGen; const keep = ui.modalAct && ui.modalAct(a);
      if (!keep && a !== "copy" && ui.modalGen === gen) hideModal(); break; // an action that opened a new modal keeps it

    case "label": openPanel("domain", t.dataset.dom); break;
  }
});
function submitSpr() {

  if (v === null) { i.classList.add("wrong"); i.setAttribute("aria-invalid", "true"); toast("Enter a number", "Use digits, a decimal like 2.5, or a fraction like 3/4.", "info"); setTimeout(() => i.classList.remove("wrong"), 600); return; }
  cur.typed = i.value; answerCurrent(null, v); render();
}

  const wrong = cur.q.c.map((_, i) => i).filter((i) => i !== cur.q.a); cur.gone = pick(wrong); cur.hinted = true; AU.buy(); render();
}

    const m = mods.find((x) => x.id === domId); if (!m) return;
    const sp = screenPos(domId);
    if (correct) {
      m.pulse = 1; corePulse = Math.max(corePulse, 0.6);
      let k = 0; for (let i = 0; i < N && k < (low ? 12 : 26); i++) { const p = parts[i]; if (p.t > 0.85) { assign(p, mods.indexOf(m)); p.sp = rnd(0.6, 1.1); k++; } }
      if (sp) popAt(sp.x + rnd(-12, 12), sp.y - 10, `+${fmt(reward)}`, S.combo >= 5 ? "big" : "");
    } else if (sp) popAt(sp.x, sp.y - 10, "miss", "bad");
    sync();
  }
  function setLow(v) {
    low = v; renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, low ? 1 : 1.5));
    scene.remove(stars); stars.geometry.dispose(); stars = makeStars(low ? 700 : 2200); scene.add(stars);
    if (clouds) clouds.visible = !low;
    stream.material.size = low ? 0.13 : 0.15;
  }
  sync();
  return { frame, sync, onAnswer, screenPos, setLow, shake: (v) => { if (S.settings.fx) shake = Math.max(shake, v); }, pulse: (id) => { if (id === "core") corePulse = 1; else { const m = mods.find((x) => x.id === id); if (m) m.pulse = 1; } sync(); } };
}

/* ================================================================
   Main loop, offline progress, boot
   ================================================================ */
let raf = 0, running = false, frameCount = 0, lastNow = 0, slowAcc = 0, slowN = 0, slowHinted = false;
function loop(now) {
  if (!running) return;
  raf = requestAnimationFrame(loop);
  if (lastNow && frameCount > 120 && frameCount <= 420) { slowAcc += now - lastNow; slowN++; if (frameCount === 420 && !slowHinted && !S.settings.low && slowAcc / slowN > 26) { slowHinted = true; toast("Running slow?", "Turn on Low graphics in Settings for a smoother orbit.", "info"); } }
  lastNow = now;
  tickEconomy();
  if (scene3d) scene3d.frame(now);
  if ((++frameCount & 3) === 0) { updateHUD(); refreshCosts(); }
  if ((frameCount & 255) === 0) checkAchievements();
}
function start() { if (running) return; running = true; raf = requestAnimationFrame(loop); }
function stop() { running = false; cancelAnimationFrame(raf); }
document.addEventListener("visibilitychange", () => { if (document.hidden) { stop(); save(); } else { S.lastTick = Math.max(S.lastTick, Date.now() - offlineCap() * 1000); start(); } });
window.addEventListener("pagehide", save);
window.addEventListener("beforeunload", save);

function computeOffline() {
  // Runs synchronously right after load, before anything can touch lastSave.
  const away = (Date.now() - S.lastSave) / 1000;
  const rate = production(false);
  S.lastTick = Date.now();
  if (away < 90 || rate <= 0) return null;
  const counted = Math.min(away, offlineCap());
  const earned = rate * counted; earn(earned, "offline");
  return { away, rate, earned, capped: away > offlineCap() };
}
function showAway(o) {
  showModal(`<h2><small>While you were away</small>The station kept working</h2>
    <div class="away">
      <div class="stat"><div class="v num">${fmtDur(o.away)}</div><div class="k">time away</div></div>
      <div class="stat"><div class="v num">+${fmt(o.earned)}</div><div class="k">Data earned</div></div>
      <div class="stat"><div class="v num">${fmtRate(o.rate)}/s</div><div class="k">rate while away</div></div>
      <div class="stat"><div class="v num">${fmtDur(offlineCap())}</div><div class="k">offline cap</div></div>
    </div>
    ${o.capped ? `<p class="small" style="color:var(--warn)">You were away longer than the cap. Build Uplink Antennas in the Station to extend it.</p>` : ""}`,
    [{ label: "Collect", cls: "gold", act: "close" }]);
  AU.whoosh();
}
function applyStreak() {
  const today = dayKey(); if (S.streak.last === today) return;
  const gap = daysBetween(S.streak.last, today);
  S.streak.days = gap === 1 ? S.streak.days + 1 : 1; S.streak.last = today;
  if (gap === 1) toast("Daily streak", `${S.streak.days} day${S.streak.days > 1 ? "s" : ""} in a row${S.res.crew ? ` · production ×${streakMult().toFixed(2)}` : ""}`, "info");
}
function welcome() {
  showModal(`<h2><small>Welcome aboard</small>ORBIT 1520</h2>
    <p>You are building a research station in orbit, and it runs on what you know. Every correct PSAT question sends <b class="gold">Data</b> down the knowledge stream. Spend it on modules, satellites, and rings, and the station keeps earning while you are away.</p>
    <p>The eight glowing modules are the eight PSAT domains. They grow and brighten as your mastery rises, so the station <i>is</i> your score. Click any module to practice it. Missed questions come back until you beat them.</p>
    <p class="small dim">Drag to orbit the planet, scroll or pinch to zoom. Sound is on; press <kbd>M</kbd> to mute.</p>`,
    [{ label: "Start practicing", cls: "primary", act: "go" }], (a) => { if (a === "go") { S.welcomed = true; save(); startSession(); nextQuestion(); openPanel("practice"); } });
}
(async function boot() {
  const had = loadState();
  const away = computeOffline();
  applyStreak(); ensureMissions();
  byId("labels").style.display = S.settings.labels ? "" : "none";
  syncMute();
  byId("bootMsg").textContent = "Loading three.js…";
  scene3d = await initScene();
  if (!scene3d) {
    byId("bootMsg").textContent = "3D view unavailable (offline?). Playing in 2D mode.";
    // 2D fallback labels arranged in a circle so modules stay clickable
    const layer = byId("labels"); layer.style.pointerEvents = "auto";
    DOMAINS.forEach((d, i) => { const e = document.createElement("div"); e.className = "lbl on"; e.style.setProperty("--c", d.css); e.dataset.act = "label"; e.dataset.dom = d.id; e.style.pointerEvents = "auto"; e.innerHTML = `<b>${esc(d.short)}</b><i>${Math.round(S.dom[d.id].r * 100)}%</i>`; const a = (i / 8) * Math.PI * 2; e.style.left = `calc(50% + ${Math.cos(a) * 34}vmin)`; e.style.top = `calc(50% + ${Math.sin(a) * 30}vmin)`; layer.appendChild(e); });
    scene3d = null;
    setTimeout(() => byId("boot").classList.add("gone"), 1200);
  } else byId("boot").classList.add("gone");
  if (away) showAway(away);
  updateHUD(); start();
  setInterval(save, 10000);
  if (!had || !S.welcomed) { if (byId("modal").hidden) welcome(); else ui.modalAct = ((prev) => (a) => { const r = prev && prev(a); setTimeout(welcome, 50); return r; })(ui.modalAct); }
  checkAchievements();
  window.ORBIT = { get state() { return S; }, get cur() { return cur; }, save, BANK, DOMAINS, score, production, nextQuestion, answerCurrent, openPanel, _: { parseNum, sprMatch, pickQuestion, genQuestion, GEN, startSession, publish, starsForPublish } };
})();
</script>
