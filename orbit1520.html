<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ORBIT 1520</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="ORBIT 1520: an idle PSAT/NMSQT study game. Answer real practice questions to grow an orbital research station.">
<meta name="theme-color" content="#060a16">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }
</script>
<style>
:root{
  color-scheme:dark;
  --bg:#060a16;--bg2:#0a1124;--panel:rgba(10,17,36,.92);--panel2:rgba(16,26,52,.9);--line:rgba(120,150,210,.16);--line2:rgba(120,150,210,.3);
  --ink:#e9eefb;--ink2:#aab6d3;--ink3:#6f7ea0;
  --cyan:#4fd8ff;--cyan2:#a9ecff;--gold:#ffc94d;--gold2:#ffe19a;--star:#c9a6ff;--ok:#42e39b;--bad:#ff6b6b;--warn:#ffb15e;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --m:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --panel-w:460px;--hud-h:60px;--r:14px;
  --sat:1;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;touch-action:none;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed;opacity:.5}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.num{font-family:var(--m);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:radial-gradient(1200px 800px at 60% 40%,#0c1630 0%,#060a16 60%,#03050c 100%)}
#labels,#popups{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;transition:opacity .25s;will-change:transform}
.lbl.on{opacity:1}
.lbl b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c,#fff);text-shadow:0 0 8px rgba(0,0,0,.9),0 1px 2px #000;white-space:nowrap}
.lbl i{font-style:normal;font-family:var(--m);font-size:11px;color:var(--ink2);background:rgba(6,10,22,.7);border:1px solid var(--line);padding:1px 6px;border-radius:999px;backdrop-filter:blur(4px)}
.lbl .bar{width:54px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.lbl .bar span{display:block;height:100%;background:var(--c,#fff);width:0%}
.pop{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-family:var(--m);font-weight:700;font-size:18px;color:var(--gold);text-shadow:0 0 10px rgba(255,201,77,.6),0 1px 2px #000;animation:popup 1.1s ease-out forwards;white-space:nowrap}
.pop.bad{color:var(--bad);text-shadow:0 0 10px rgba(255,107,107,.6)}
.pop.txt{color:var(--cyan2);font-size:14px;font-weight:600}
.pop.big{font-size:26px}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;height:var(--hud-h);z-index:20;display:flex;align-items:center;gap:14px;padding:0 14px;padding-top:env(safe-area-inset-top,0);background:linear-gradient(180deg,rgba(6,10,22,.92),rgba(6,10,22,.55) 80%,transparent);pointer-events:none}
#hud>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-size:17px;letter-spacing:.18em;font-weight:800;white-space:nowrap;background:linear-gradient(90deg,var(--cyan2),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font-size:10px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;margin-top:3px}
.hudscore{display:flex;align-items:baseline;gap:8px;cursor:pointer;border-radius:10px;padding:4px 10px;border:1px solid transparent}
.hudscore:hover{border-color:var(--line2);background:rgba(10,17,36,.6)}
.hudscore .big{font-family:var(--m);font-size:26px;font-weight:800;color:#fff;letter-spacing:-.02em}
.hudscore .of{font-family:var(--m);font-size:13px;color:var(--ink3)}
.hudscore .split{font-family:var(--m);font-size:11px;color:var(--ink2);display:flex;flex-direction:column;line-height:1.2}
.res{display:flex;gap:10px;margin-left:auto}
.pill{display:flex;align-items:center;gap:8px;background:rgba(10,17,36,.75);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;backdrop-filter:blur(6px);min-width:0}
.pill .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#0a0f1e;flex:none}
.pill .v{font-family:var(--m);font-weight:700;font-size:15px;line-height:1;white-space:nowrap}
.pill .s{font-family:var(--m);font-size:10.5px;color:var(--ink3);line-height:1;margin-top:3px;white-space:nowrap}
.pill.data .ic{background:var(--gold)}
.pill.star .ic{background:var(--star)}
.pill.combo{border-color:rgba(255,201,77,.4)}
.pill.combo .ic{background:#ff8a4d}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(10,17,36,.75);border:1px solid var(--line);color:var(--ink2);backdrop-filter:blur(6px)}
.iconbtn:hover{color:#fff;border-color:var(--line2)}
.iconbtn.off{color:var(--ink3)}

/* Dock */
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:35;display:flex;gap:6px;padding:6px;background:rgba(10,17,36,.85);border:1px solid var(--line2);border-radius:999px;backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.5)}
#dock button{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;color:var(--ink2);font-weight:600;font-size:14px;position:relative;transition:background .15s,color .15s}
#dock button:hover{color:#fff;background:rgba(255,255,255,.06)}
#dock button.on{background:linear-gradient(135deg,rgba(79,216,255,.25),rgba(79,216,255,.08));color:#fff;box-shadow:inset 0 0 0 1px rgba(79,216,255,.35)}
#dock button.primary{background:linear-gradient(135deg,var(--cyan),#2aa9ff);color:#04101f}
#dock button.primary:hover{filter:brightness(1.1)}
#dock .dot{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}

/* Panel */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(var(--panel-w),100%);z-index:30;background:var(--panel);border-left:1px solid var(--line2);backdrop-filter:blur(14px);transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.45)}
#panel.open{transform:none}
.phead{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0)) 16px 10px;border-bottom:1px solid var(--line)}
.phead h2{margin:0;font-size:15px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--cyan2);flex:1}
.pbody{flex:1;overflow:auto;padding:14px 16px 90px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.pbody::-webkit-scrollbar{width:8px}.pbody::-webkit-scrollbar-thumb{background:rgba(120,150,210,.25);border-radius:4px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}.dim{color:var(--ink3)}.small{font-size:12.5px}.tiny{font-size:11px}
.gold{color:var(--gold)}.cyan{color:var(--cyan)}.ok{color:var(--ok)}.bad{color:var(--bad)}.starc{color:var(--star)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px;background:rgba(79,216,255,.12);border:1px solid rgba(79,216,255,.3);color:var(--cyan2);transition:transform .08s,background .15s;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(79,216,255,.22)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),#2aa9ff);color:#04101f;border-color:transparent}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ff9d3d);color:#1d1200;border-color:transparent}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--ink2)}
.btn.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.4);color:#ffb3b3}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.wide{width:100%}
.btn .cost{font-family:var(--m);font-weight:700;font-size:12px;opacity:.9}
.btn.cant{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line2);color:var(--ink2);background:rgba(255,255,255,.03)}
.chip .sw{width:8px;height:8px;border-radius:50%;background:var(--c,#fff);box-shadow:0 0 6px var(--c,#fff)}
.chip.on{color:#fff;border-color:var(--c,var(--cyan));background:color-mix(in srgb,var(--c,var(--cyan)) 18%,transparent)}
.chip.t1{color:#9be7b1}.chip.t2{color:#ffd58a}.chip.t3{color:#ff9b9b}
.chip.rev{color:var(--star);border-color:rgba(201,166,255,.5)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--c,var(--cyan)),color-mix(in srgb,var(--c,var(--cyan)) 60%,#fff));transition:width .4s}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kv b{font-family:var(--m);font-weight:600;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat .v{font-family:var(--m);font-weight:800;font-size:18px}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}

/* Question card */
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px}
.qmeta .timer{margin-left:auto;font-family:var(--m);font-size:12px;color:var(--ink3)}
.passage{font-size:15px;line-height:1.6;color:var(--ink);background:rgba(255,255,255,.03);border-left:3px solid var(--c,var(--cyan));padding:10px 12px;border-radius:0 10px 10px 0;margin-bottom:12px}
.passage p{margin:0 0 8px}.passage p:last-child{margin:0}
.passage p.tx{font-weight:800;color:var(--ink3);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.passage ul{margin:4px 0 0;padding-left:18px}.passage li{margin:3px 0}
.passage table{border-collapse:collapse;width:100%;font-size:13.5px;margin:6px 0 2px}
.passage caption{caption-side:top;text-align:left;font-weight:700;font-size:12.5px;color:var(--ink2);padding-bottom:4px}
.passage th,.passage td{border:1px solid var(--line2);padding:4px 8px;text-align:left}
.passage th{background:rgba(255,255,255,.05);font-weight:700}
.passage td.n{font-family:var(--m);text-align:right}
.stem{font-size:15.5px;font-weight:600;margin-bottom:12px;line-height:1.5}
.stem .math{font-family:var(--m);font-weight:600}
.choices{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.choices button{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-size:14.5px;line-height:1.4;transition:background .12s,border-color .12s,transform .08s}
.choices button:hover:not(:disabled){background:rgba(79,216,255,.08);border-color:rgba(79,216,255,.4)}
.choices button:active:not(:disabled){transform:scale(.99)}
.choices .L{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--m);font-weight:800;font-size:12px;color:var(--ink2)}
.choices button.right{background:rgba(66,227,155,.14);border-color:var(--ok)}
.choices button.right .L{background:var(--ok);color:#03150c;border-color:var(--ok)}
.choices button.wrong{background:rgba(255,107,107,.12);border-color:var(--bad)}
.choices button.wrong .L{background:var(--bad);color:#1a0505;border-color:var(--bad)}
.choices button.gone{opacity:.32;text-decoration:line-through}
.choices button:disabled{cursor:default;opacity:1}
.choices button:disabled:not(.right):not(.wrong){opacity:.6}
.spr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spr input{flex:1;min-width:140px;font-family:var(--m);font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:rgba(0,0,0,.25);color:#fff}
.spr input.right{border-color:var(--ok);box-shadow:0 0 0 2px rgba(66,227,155,.25)}
.spr input.wrong{border-color:var(--bad);box-shadow:0 0 0 2px rgba(255,107,107,.25)}
.spr small{width:100%;color:var(--ink3)}
.feedback{margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.2);animation:fadein .25s}
.feedback.ok{border-color:rgba(66,227,155,.5)}.feedback.bad{border-color:rgba(255,107,107,.5)}
.feedback h4{margin:0 0 6px;font-size:15px}
.feedback p{margin:0;color:var(--ink2);font-size:14px}
.reward{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.reward span{font-family:var(--m);font-size:11.5px;padding:3px 8px;border-radius:999px;background:rgba(255,201,77,.1);border:1px solid rgba(255,201,77,.3);color:var(--gold2)}
.reward span.m{background:rgba(79,216,255,.1);border-color:rgba(79,216,255,.3);color:var(--cyan2)}
.qactions{display:flex;gap:8px;margin-top:12px;align-items:center}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.combo-big{font-family:var(--m);font-weight:900;font-size:22px;color:var(--gold);text-shadow:0 0 14px rgba(255,201,77,.5)}
.sessionbar{display:flex;gap:3px;margin:8px 0 12px}
.sessionbar i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.08)}
.sessionbar i.ok{background:var(--ok)}.sessionbar i.bad{background:var(--bad)}

/* building rows */
.brow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.brow .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--c,var(--cyan));flex:none}
.brow .t{font-weight:700;font-size:14px}
.brow .d{font-size:12px;color:var(--ink3)}
.brow .lvl{font-family:var(--m);font-size:12px;color:var(--ink2)}
.mrow{cursor:pointer}
.mrow:hover .t{color:var(--c)}
.mini{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
.mini span{display:block;height:100%;background:var(--c,var(--cyan))}
.qtybar{display:flex;gap:4px}
.qtybar button{padding:4px 10px;border-radius:8px;border:1px solid var(--line2);font-family:var(--m);font-size:12px;color:var(--ink2)}
.qtybar button.on{background:rgba(79,216,255,.16);color:#fff;border-color:var(--cyan)}

/* missions / achievements */
.mis{padding:10px 0;border-top:1px solid var(--line)}
.mis:first-child{border-top:0}
.mis .t{font-weight:700;font-size:14px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.ach div{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;background:rgba(255,255,255,.03)}
.ach div.on{border-color:rgba(255,201,77,.5);background:rgba(255,201,77,.06)}
.ach b{display:block;font-size:12.5px;margin-bottom:2px}
.ach div:not(.on){opacity:.55}

/* toasts */
#toasts{position:fixed;left:14px;bottom:calc(84px + env(safe-area-inset-bottom,0));z-index:25;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(360px,calc(100vw - 28px))}
.toast{background:rgba(10,17,36,.94);border:1px solid rgba(255,201,77,.45);border-left:4px solid var(--gold);border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastin .35s cubic-bezier(.2,.8,.2,1),toastout .4s ease-in 4.2s forwards;font-size:13.5px}
.toast b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.toast.info{border-color:rgba(79,216,255,.4);border-left-color:var(--cyan)}.toast.info b{color:var(--cyan)}
@keyframes toastin{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(8px)}}

/* modal */
#modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(3,5,12,.7);backdrop-filter:blur(6px);padding:16px;animation:fadein .2s}
.mbox{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:linear-gradient(180deg,#101a36,#0a1124);border:1px solid var(--line2);border-radius:18px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mbox h2{margin:0 0 6px;font-size:22px;letter-spacing:.04em}
.mbox h2 small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);font-weight:800;margin-bottom:6px}
.mbox p{color:var(--ink2);margin:8px 0}
.mbox .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mbox textarea{width:100%;min-height:90px;font-family:var(--m);font-size:12px;background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:10px;padding:8px;color:#fff;resize:vertical}
.away{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.away .stat .v{color:var(--gold)}

/* fallback / loading */
#boot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);transition:opacity .6s}
#boot.gone{opacity:0;pointer-events:none}
.bootin{text-align:center}
.bootin b{display:block;font-size:34px;letter-spacing:.3em;font-weight:900;background:linear-gradient(90deg,var(--cyan2),var(--cyan),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.bootin span{display:block;color:var(--ink3);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:8px}
.orbitspin{width:70px;height:70px;margin:0 auto 18px;border-radius:50%;border:2px solid rgba(79,216,255,.2);border-top-color:var(--cyan);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.switch{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.12);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--cyan)}.switch.on::after{transform:translateX(18px)}
kbd{font-family:var(--m);font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);background:rgba(255,255,255,.05)}

.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:15;background:radial-gradient(circle at 50% 50%,rgba(255,201,77,.22),transparent 60%);opacity:0}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

@media (max-width:760px){
  :root{--hud-h:54px}
  #hud{gap:8px;padding:0 10px}

<script type="module">
/* ================================================================
   ORBIT 1520 — question bank
   Original practice items written for this game in the style of the
   Digital PSAT/NMSQT. Not College Board material.
   Fields: id, d (domain), t (tier 1 easy / 2 medium / 3 hard),
   p (passage), notes (student notes), table, q (stem),
   c (4 choices) + a (correct index)  OR  spr:true + a (number | numbers)
   e (short explanation)
   ================================================================ */
const DOMAINS = [
  { id: "cs",  sec: "rw", name: "Craft & Structure",              short: "Craft",       color: 0xf7b955, css: "#f7b955", desc: "Words in context, text structure and purpose, and connections between paired texts." },
  { id: "ii",  sec: "rw", name: "Information & Ideas",            short: "Ideas",       color: 0xff7e67, css: "#ff7e67", desc: "Central ideas, supporting details, inferences, and using textual or quantitative evidence." },
  { id: "sec", sec: "rw", name: "Standard English Conventions",   short: "Conventions", color: 0xc792ea, css: "#c792ea", desc: "Sentence boundaries, punctuation, agreement, verb forms, and modifiers." },
  { id: "eoi", sec: "rw", name: "Expression of Ideas",            short: "Expression",  color: 0xff5fa2, css: "#ff5fa2", desc: "Transitions between ideas and rhetorical synthesis from student notes." },
  { id: "alg", sec: "m",  name: "Algebra",                        short: "Algebra",     color: 0x4fd8ff, css: "#4fd8ff", desc: "Linear equations and inequalities, systems, and linear functions in context." },
  { id: "adv", sec: "m",  name: "Advanced Math",                  short: "Adv. Math",   color: 0x58f0a0, css: "#58f0a0", desc: "Quadratics, exponentials, polynomials, radicals, and nonlinear functions." },
  { id: "psd", sec: "m",  name: "Problem-Solving & Data Analysis", short: "Data",        color: 0x7cc6ff, css: "#7cc6ff", desc: "Ratios, rates, percents, statistics, probability, and reading data displays." },
  { id: "geo", sec: "m",  name: "Geometry & Trigonometry",        short: "Geometry",    color: 0xffe66d, css: "#ffe66d", desc: "Area and volume, angles, triangles, circles, and right-triangle trigonometry." },
];
const DOM = Object.fromEntries(DOMAINS.map(d => [d.id, d]));
const WIC = "Which choice completes the text with the most logical and precise word or phrase?";
const CONV = "Which choice completes the text so that it conforms to the conventions of Standard English?";
const TRANS = "Which choice completes the text with the most logical transition?";
const NOTES_Q = (goal) => `The student wants to ${goal}. Which choice most effectively uses relevant information from the notes to accomplish this goal?`;

const BANK = [
/* ---------------- Craft & Structure ---------------- */
{ id:"cs1", d:"cs", t:1, p:"For decades, the small coastal town relied on a single cannery for employment. When the plant closed in 1998, residents feared the local economy would collapse; instead, the town’s response was remarkably ______: within five years, a cluster of boat-repair shops and a seasonal market had replaced the lost jobs.", q:WIC,
  c:["resilient","predictable","reluctant","uniform"], a:0, e:"The colon introduces evidence that the town recovered and adapted after a setback, which is what “resilient” means." },
{ id:"cs2", d:"cs", t:1, p:"Marine biologist Ayana Reyes has spent years documenting the songs of humpback whales, and her recordings are notably ______: some capture a single whale for over six hours without interruption.", q:WIC,
  c:["brief","extensive","improvised","optional"], a:1, e:"Recordings that run for six uninterrupted hours are long and thorough, so “extensive” fits; “brief” says the opposite." },
{ id:"cs3", d:"cs", t:1, p:"Most visitors to the museum hurry past the hallway of ceramic fragments on their way to the famous mural. But the fragments repay attention. Each shard carries a fingerprint pressed into the clay before firing—a trace of a specific, unnamed worker who lived over two thousand years ago.", q:"Which choice best states the main purpose of the text?",
  c:["To argue that the mural is overrated compared with the museum’s other holdings","To encourage readers to notice an overlooked exhibit by explaining what makes it meaningful","To describe the technique ancient potters used to fire clay","To explain why the museum acquired the ceramic fragments"], a:1, e:"The text says visitors skip the fragments, then explains why they “repay attention”: its purpose is to draw attention to an overlooked exhibit." },
{ id:"cs4", d:"cs", t:1, p:"Although the two committee members frequently disagreed in public, their private correspondence reveals a relationship that was surprisingly ______; they exchanged warm letters for over thirty years.", q:WIC,
  c:["cordial","formal","competitive","fleeting"], a:0, e:"Thirty years of warm letters describe a friendly relationship, so “cordial” is the precise word; the public disagreement makes it “surprising.”" },
{ id:"cs5", d:"cs", t:1, p:"The following text is from a 1911 novel. The narrator describes a house she has just inherited.\n\nThe house had been shut up for eleven years, and it showed. Dust lay on the banister thick as felt. Yet when I opened the parlor shutters, the light fell on a piano still in tune, as if someone had been playing it in the dark.", q:"Which choice best describes the function of the last sentence?",
  c:["It contrasts the house’s neglected appearance with a detail suggesting the house has not been entirely abandoned.","It explains why the narrator decided to inherit the house.","It establishes that the narrator is an accomplished musician.","It summarizes the extent of the damage caused by eleven years of neglect."], a:0, e:"“Yet” signals a contrast: after describing dust and neglect, the sentence offers the eerie detail of a piano still in tune." },
{ id:"cs6", d:"cs", t:2, p:"Early accounts of the 1815 eruption of Mount Tambora were largely ______: writers who had never visited the region repeated secondhand reports, and the actual scale of the disaster was not established until scientists examined ash deposits more than a century later.", q:WIC,
  c:["corroborated","speculative","exhaustive","meticulous"], a:1, e:"Accounts based on secondhand reports by writers who never visited are guesswork, so “speculative” fits; the other choices suggest confirmed or careful work." },
{ id:"cs7", d:"cs", t:2, p:"Historian Lin Zhao has challenged the common claim that medieval European villages were economically isolated. Examining coin hoards buried in rural England, Zhao found silver pennies minted as far away as Baghdad. The presence of these coins does not prove that villagers traded directly with distant markets, Zhao cautions; the pennies may have passed through many hands. Still, they show that even small settlements were linked, however indirectly, to a much wider world.", q:"Which choice best describes the function of the third sentence in the text as a whole?",
  c:["It identifies a limitation of Zhao’s evidence before the text states the conclusion the evidence does support.","It presents a counterargument that the text ultimately rejects as unfounded.","It explains the method Zhao used to date the coin hoards.","It suggests that Zhao’s findings apply only to villages in England."], a:0, e:"The third sentence concedes what the coins cannot prove; “Still” then introduces the more limited conclusion they do support." },
{ id:"cs8", d:"cs", t:2, p:"The playwright’s early work was criticized as ______, relying on stock characters and predictable endings, but her later plays abandoned convention so thoroughly that some audiences found them baffling.", q:WIC,
  c:["derivative","innovative","obscure","ambitious"], a:0, e:"Work built on stock characters and predictable endings copies existing models, which is what “derivative” means; “but” contrasts it with her unconventional later plays." },
{ id:"cs9", d:"cs", t:2, p:"Text 1\nUrban beekeeping has become popular as a way to support pollinators. Advocates point out that city gardens, parks, and balcony planters offer honeybees a surprisingly varied diet, and rooftop hives now number in the thousands in some cities.\n\nText 2\nEcologist Priya Natarajan notes that honeybees are a managed, non-native species in North America. Her team found that in neighborhoods with dense concentrations of hives, wild bee species—which pollinate many native plants—declined as honeybees competed for the same flowers.", q:"Based on the texts, how would Natarajan (Text 2) most likely respond to the advocates described in Text 1?",
  c:["By agreeing that honeybees can thrive in cities but cautioning that their success may come at the expense of wild pollinators","By arguing that city gardens do not provide enough food for honeybees to survive","By suggesting that rooftop hives should be replaced with hives at ground level","By claiming that wild bee species are not effective pollinators of native plants"], a:0, e:"Text 2 does not dispute that honeybees do well in cities; it adds that dense hives crowd out wild bees, a cost the advocates overlook." },
{ id:"cs10", d:"cs", t:2, p:"Photographs of the 1930s Dust Bowl are so familiar that they can seem to tell the whole story: black clouds, buried fences, families on the road. Less often shown are the images farmers took of themselves in the same years—posed proudly beside new tractors or gathered at county fairs. These pictures do not deny the catastrophe. They complicate it, reminding us that the people in the famous photographs were not only victims of the decade but also participants in it.", q:"Which choice best describes the overall structure of the text?",
  c:["It describes a widely known set of images, introduces a lesser-known set, and explains how the second set changes our understanding of the period.","It argues that the famous Dust Bowl photographs were staged and should not be trusted.","It compares photography with other art forms of the 1930s.","It presents a chronological account of the Dust Bowl from its causes to its aftermath."], a:0, e:"The text moves from familiar images to the farmers’ own photographs and ends by explaining how those photographs “complicate” the familiar story." },
{ id:"cs11", d:"cs", t:2, p:"In her study of coral reefs, Dr. Okafor deliberately avoided ______ conclusions; because her data covered only two seasons, she reported trends as preliminary and called for longer observation.", q:WIC,
  c:["tentative","sweeping","modest","provisional"], a:1, e:"With limited data she avoided broad, far-reaching claims, so “sweeping” fits; “tentative” and “provisional” describe the conclusions she actually offered." },
{ id:"cs12", d:"cs", t:3, p:"Critics of the new translation have called it unfaithful, but the translator has argued that a strictly literal rendering would itself be a kind of betrayal: the original poem’s puns and rhythms, she contends, are not ______ to its meaning but constitutive of it, so a version that preserves the words while losing the music preserves very little.", q:WIC,
  c:["incidental","essential","hostile","equivalent"], a:0, e:"The “not X but constitutive” structure needs a word opposite to “constitutive” (essential); “incidental” means secondary or nonessential." },
{ id:"cs13", d:"cs", t:3, p:"The following text is adapted from a 1902 essay on natural history.\n\nIt is the custom of writers to praise the ant for industry. I confess I have watched ants for many summers without finding in them any quality I could honestly call a virtue. They labor, yes; but so does the tide. What I have found instead, and what interests me far more, is a creature whose every apparent decision is the sum of a thousand tiny accidents of scent and touch.", q:"The main purpose of the text is to",
  c:["reject a conventional moral interpretation of ant behavior in favor of a more mechanistic explanation.","argue that ants are less industrious than earlier writers claimed.","compare the movements of ants with the motion of the tides.","describe the methods the author used to observe ants over many summers."], a:0, e:"The author dismisses the idea that ants have virtues and instead describes their behavior as the sum of physical “accidents of scent and touch.”" },
{ id:"cs14", d:"cs", t:3, p:"Text 1\nSome archaeologists interpret the large stone enclosures at a Neolithic site in Anatolia as temples, since they contain carved pillars and no obvious traces of everyday activities such as cooking. In this view, the site shows that organized religion preceded, and perhaps motivated, the shift to settled farming.\n\nText 2\nRecent excavations at the same site uncovered grinding stones, cisterns, and domestic structures around the enclosures. Archaeologist Dana Feld argues that the distinction between ritual and daily life at the site may be a modern assumption rather than an ancient reality, and that the enclosures could have served a community that already lived and worked there.", q:"Based on the texts, Feld (Text 2) would most likely characterize the interpretation described in Text 1 as",
  c:["resting on an assumption that new evidence calls into question.","correct in its conclusion but based on the wrong carved pillars.","too focused on the site’s cisterns and grinding stones.","convincingly demonstrating that farming preceded religion."], a:0, e:"Feld says the ritual-versus-daily-life split “may be a modern assumption,” and the new domestic finds undercut the “no everyday activity” reasoning in Text 1." },
{ id:"cs15", d:"cs", t:3, p:"Economist Marta Ibáñez set out to measure how much a city’s new tram line raised nearby property values. The obvious comparison—prices near the line versus prices elsewhere—was unusable, because the tram had been routed through neighborhoods that were already growing. Ibáñez instead compared neighborhoods along the finished route with neighborhoods along a second route that had been fully planned and then canceled for budget reasons. The two sets of neighborhoods had been selected by the same planners, using the same criteria.", q:"Which choice best describes the function of the last sentence?",
  c:["It explains why the canceled route provides a fair basis for comparison.","It reveals that the tram’s effect on property values was smaller than expected.","It criticizes the planners for canceling the second route.","It introduces a second, unrelated study by Ibáñez."], a:0, e:"Because both sets of neighborhoods were chosen the same way, the canceled route is a fair comparison group, which is the problem the earlier sentences raised." },
{ id:"cs16", d:"cs", t:3, p:"The committee’s report was praised for its ______: rather than burying its recommendations in qualifications, it stated in plain terms which policies had failed and why.", q:WIC,
  c:["candor","ambivalence","discretion","nuance"], a:0, e:"Stating plainly what failed, without hedging, is frankness, or “candor”; “nuance” and “discretion” would describe a more qualified report." },

/* ---------------- Information & Ideas ---------------- */
{ id:"ii1", d:"ii", t:1, p:"Sea otters spend much of their day floating on their backs, and they often wrap themselves in strands of kelp before sleeping. The kelp acts as an anchor, keeping the otters from drifting out to sea on the current while they rest.", q:"Which choice best states the main idea of the text?",
  c:["Sea otters use kelp to keep themselves in place while they sleep.","Sea otters are unable to swim against strong currents.","Kelp forests are shrinking because of sea otter activity.","Sea otters spend most of their lives asleep."], a:0, e:"Both sentences build to one point: the kelp anchors resting otters so they do not drift away." },
{ id:"ii2", d:"ii", t:1, p:"In 1893, New Zealand became the first self-governing country to grant women the right to vote in national elections. The change followed a petition campaign led by Kate Sheppard, whose final petition carried nearly 32,000 signatures—about a quarter of the adult women in the country at the time.", q:"According to the text, what was notable about Sheppard’s final petition?",
  c:["It was signed by roughly one in four adult women in New Zealand.","It was the first petition ever presented to New Zealand’s legislature.","It was rejected by lawmakers in 1893.","It was signed mostly by women living outside New Zealand."], a:0, e:"The text says the signatures represented “about a quarter of the adult women in the country,” which is one in four." },
{ id:"ii3", d:"ii", t:1, table:{cap:"Average Daily Visitors to Four City Library Branches, 2023", head:["Branch","Average daily visitors"], rows:[["Riverside","410"],["Northgate","285"],["Old Town","620"],["Hillcrest","190"]]}, p:"A city council report noted that the busiest library branch served more than twice as many daily visitors as the least busy branch.", q:"Which choice best uses data from the table to support the report’s claim?",
  c:["Old Town averaged 620 daily visitors, while Hillcrest averaged 190.","Riverside averaged 410 daily visitors, while Northgate averaged 285.","Northgate averaged 285 daily visitors, while Hillcrest averaged 190.","Old Town averaged 620 daily visitors, while Riverside averaged 410."], a:0, e:"The claim compares the busiest (Old Town, 620) with the least busy (Hillcrest, 190), and 620 is more than twice 190." },
{ id:"ii4", d:"ii", t:1, p:"Bats that hunt insects rely on echolocation, emitting calls and listening for the echoes. Some moths, however, have evolved ears tuned to the frequencies of bat calls. When such a moth hears an approaching bat, it typically drops abruptly toward the ground. This suggests that ______", q:"Which choice most logically completes the text?",
  c:["the moth’s sudden drop is a defensive response to the threat of being caught.","bats cannot detect moths that are resting on the ground.","moths use echolocation to locate flowers at night.","bats prefer to hunt moths over other insects."], a:0, e:"The moth’s ears detect bat calls and trigger the drop, so the drop is best explained as an escape behavior." },
{ id:"ii5", d:"ii", t:1, p:"The Antikythera mechanism, recovered from a shipwreck in 1901, is a bronze device of interlocking gears built in ancient Greece around 100 BCE. Researchers using X-ray imaging have determined that it modeled the movements of the sun and moon and could predict eclipses decades in advance.", q:"According to the text, how did researchers learn what the mechanism could do?",
  c:["By studying it with X-ray imaging","By reading instructions recovered with the device","By recreating the shipwreck in a laboratory","By comparing it with modern clocks"], a:0, e:"The text states directly that “researchers using X-ray imaging” determined what the device modeled." },
{ id:"ii6", d:"ii", t:2, p:"Some literary scholars argue that the anonymous fourteenth-century poem “Pearl” was written by the same poet who wrote “Sir Gawain and the Green Knight.” They note that both poems survive in a single manuscript, copied by the same hand, and that they share an unusual dialect. A skeptic, however, might respond that a shared manuscript and dialect show only where the poems were copied, not who composed them.", q:"Which finding, if true, would most directly support the scholars’ argument against the skeptic’s response?",
  c:["The two poems use the same rare vocabulary and the same intricate stanza-linking technique, features not found in other poems from the region.","The manuscript containing the poems was copied about fifty years after they were composed.","Many poems from the same region were written in the same dialect.","The manuscript also contains a third poem written in a different dialect."], a:0, e:"Shared rare features of composition (not just copying or dialect) point to a single author, which answers the skeptic’s objection." },
{ id:"ii7", d:"ii", t:2, table:{cap:"Households with Broadband Internet Access, by County Type", head:["Year","Urban counties","Rural counties"], rows:[["2015","78%","55%"],["2023","91%","74%"]]}, p:"A researcher claims that although the gap in broadband access between urban and rural households narrowed between 2015 and 2023, a substantial gap remained.", q:"Which choice best describes data from the table that support the researcher’s claim?",
  c:["The gap fell from 23 percentage points in 2015 to 17 percentage points in 2023.","Rural access rose by 19 percentage points, more than urban access rose.","Urban access exceeded 90% in 2023.","Rural access was below 60% in 2015."], a:0, e:"78 − 55 = 23 and 91 − 74 = 17: the gap narrowed but a 17-point gap remained, matching both parts of the claim." },
{ id:"ii8", d:"ii", t:2, p:"Zebra finches learn their songs by imitating adult males during a sensitive period early in life, and finches raised in isolation produce abnormal songs. Yet when researchers allowed isolated finches to tutor their own offspring, and those offspring to tutor the next generation, the songs drifted over several generations toward the normal wild-type song. This suggests that ______", q:"Which choice most logically completes the text?",
  c:["the species’ typical song is shaped not only by learning but also by innate preferences that guide learning across generations.","zebra finches cannot learn songs after the sensitive period ends.","isolated finches learn songs more quickly than finches raised in groups.","the wild-type song is less complex than the songs of isolated finches."], a:0, e:"If songs converge on the wild type even without a normal tutor, something built in must be steering the learning." },
{ id:"ii9", d:"ii", t:2, p:"When the city of Curitiba, Brazil, could not afford a subway in the 1970s, planners designed a bus system that borrowed the subway’s key features: dedicated lanes, raised platforms where riders paid before boarding, and buses arriving every few minutes. The system moved riders nearly as quickly as a subway at a small fraction of the cost, and it has since been copied by more than 150 cities.", q:"Which choice best states the main idea of the text?",
  c:["Curitiba created an inexpensive bus system that achieved much of a subway’s effectiveness and became a widely imitated model.","Subways are too expensive for most cities to build.","Curitiba’s bus system was eventually replaced by a subway.","Riders in Curitiba preferred buses to subways."], a:0, e:"The text describes the system’s design, its subway-like performance at low cost, and its wide adoption; the correct choice captures all three." },
{ id:"ii10", d:"ii", t:2, p:"In the novel “Salt Roads,” author Imani Cole tells the story of a lighthouse keeper’s daughter through letters the daughter never sends. A student claims that the unsent letters allow Cole to reveal the daughter’s private feelings while also showing her isolation.", q:"Which quotation from “Salt Roads” most effectively illustrates the student’s claim?",
  c:["“I write to you every night, Mother, and every morning I fold the page into the tin under my bed, where no one will read it, least of all you.”","“The lamp must be lit at dusk, whatever the weather, and Father says the ships depend on it.”","“The supply boat comes on Thursdays, bringing flour, oil, and the newspaper from the mainland.”","“I have counted the steps to the top of the tower so many times that I could climb them asleep.”"], a:0, e:"Only the quotation about folding each letter into a tin shows both parts of the claim: an intimate address to her mother and the fact that no one, “least of all you,” will read it." },
{ id:"ii11", d:"ii", t:2, table:{cap:"Preferred Study Location, Survey of 200 Students", head:["Location","Students"], rows:[["Library","84"],["Home","62"],["Café","34"],["Outdoors","20"]]}, p:"The school newspaper reported that the library was the most popular study location but that fewer than half of the students surveyed chose it.", q:"Which choice best uses data from the table to support the newspaper’s report?",
  c:["84 of the 200 students chose the library, more than any other location but fewer than 100.","62 students chose home, which was the second most popular location.","Only 20 students chose to study outdoors.","Together, the library and home were chosen by 146 students."], a:0, e:"The report has two parts, most popular and under half; 84 is the largest count and is less than 100 (half of 200)." },
{ id:"ii12", d:"ii", t:3, p:"Researchers studying a hospital found that patients recovering from surgery in rooms with windows facing a courtyard garden were discharged, on average, a day earlier than patients in rooms facing a brick wall. The researchers proposed that the view of greenery itself sped recovery.", q:"Which finding, if true, would most directly weaken the researchers’ proposal?",
  c:["The garden-facing rooms were on a quieter side of the building and received more natural light, and both quiet and light are known to improve recovery.","Patients in the garden-facing rooms reported enjoying the view.","The hospital later planted additional trees in the courtyard.","Patients in both types of rooms received the same medications."], a:0, e:"If the garden rooms were also quieter and brighter, those differences could explain the faster recovery, so the greenery “itself” may not be the cause." },
{ id:"ii13", d:"ii", t:3, p:"Historians once assumed that the printing press quickly displaced hand-copied manuscripts in fifteenth-century Europe. But inventories from the period show that wealthy buyers continued to commission handwritten books for decades after printing arrived, often paying far more for them than a printed copy would cost. Because these buyers could easily have obtained printed versions of the same texts, it seems likely that ______", q:"Which choice most logically completes the text?",
  c:["manuscripts continued to carry a prestige that printed books did not, making them desirable apart from their content.","printed books were unavailable in the regions where these buyers lived.","the printing press produced books of higher quality than scribes could.","handwritten books were cheaper to produce than printed ones."], a:0, e:"If the same text was available cheaply in print, paying more for a manuscript must have been about something other than the text, such as prestige." },
{ id:"ii14", d:"ii", t:3, table:{cap:"Forest Area Occupied by Overwintering Monarch Butterflies (hectares)", head:["Year","2012","2014","2016","2018","2020","2022"], rows:[["Hectares","1.19","0.67","4.01","6.05","2.10","2.84"]]}, p:"A conservation biologist argues that year-to-year figures can be misleading and that no single year should be used to judge whether the monarch population is recovering.", q:"Which choice best uses data from the table to support the biologist’s argument?",
  c:["The area rose from 0.67 hectares in 2014 to 6.05 in 2018, then fell to 2.10 in 2020, showing large swings in both directions within a few years.","The area occupied in 2022 was 2.84 hectares.","The area occupied in 2012 was greater than in 2014.","The area more than doubled between 2014 and 2016."], a:0, e:"Large swings up and then down show why one year’s figure could mislead; the other choices cite single values or one direction only." },
{ id:"ii15", d:"ii", t:3, p:"Linguist Omar Haddad studied speakers of a language with no words for “left” and “right,” who instead use compass directions even at small scales (“the cup to your north”). When asked to reproduce an arrangement of objects after being turned to face the opposite direction, these speakers tended to preserve the objects’ compass orientation, whereas English speakers preserved the arrangement relative to their own bodies. Haddad argues that habitual language use trains attention: speakers must constantly track compass directions in order to speak at all, and so they do.", q:"According to the text, why does Haddad believe the speakers he studied track compass directions so consistently?",
  c:["Because their language requires them to know those directions in order to describe ordinary scenes","Because they have an innate sense of direction that English speakers lack","Because they were trained to do so during the experiment","Because their environment lacks landmarks that could be used instead"], a:0, e:"Haddad’s explanation is that speakers “must constantly track compass directions in order to speak at all”: the language demands it." },
{ id:"ii16", d:"ii", t:3, p:"In her poem “Inventory,” Lucía Vergara catalogs the contents of her grandmother’s kitchen after the grandmother’s death. A critic argues that the poem’s power comes from its refusal to state grief directly, allowing ordinary objects to carry the emotion instead.", q:"Which quotation from “Inventory” most effectively illustrates the critic’s claim?",
  c:["“Three spoons, worn thin on one side / from stirring the same pot, in the same direction, for fifty years.”","“I miss her more than I can say, / and saying it does not make it less.”","“The kitchen is small and faces east, / and in the mornings it is full of light.”","“She taught me to cook when I was nine, / standing on a chair to reach the stove.”"], a:0, e:"The lines about the worn spoons never name grief; the objects carry it. The lines that say “I miss her” state grief directly, which is what the critic says the poem avoids." },

/* ---------------- Standard English Conventions ---------------- */
{ id:"sec1", d:"sec", t:1, p:"The collection of maps, which includes several hand-drawn charts from the 1700s, ______ housed in the library’s climate-controlled basement.", q:CONV,
  c:["is","are","were","have been"], a:0, e:"The subject is the singular “collection,” not “maps,” so the verb must be singular: “is.”" },
{ id:"sec2", d:"sec", t:1, p:"Glassblowing requires steady hands and constant attention. The molten glass cools within ______ the artisan must shape it quickly.", q:CONV,
  c:["seconds, so","seconds so","seconds,","seconds. So that"], a:0, e:"Two independent clauses are joined correctly by a comma plus the coordinating conjunction “so.” A comma alone would be a comma splice." },
{ id:"sec3", d:"sec", t:1, p:"By the time the rescue team reached the stranded hikers, the storm ______ for nearly six hours.", q:CONV,
  c:["had been raging","is raging","will have raged","rages"], a:0, e:"“By the time” plus the past-tense “reached” calls for the past perfect to show the storm began earlier and continued: “had been raging.”" },
{ id:"sec4", d:"sec", t:1, p:"The ______ new exhibit features photographs taken by students from three local high schools.", q:CONV,
  c:["museum’s","museums","museums’","museum"], a:0, e:"One museum possesses the exhibit, so the singular possessive “museum’s” is needed." },
{ id:"sec5", d:"sec", t:1, p:"Amelia Earhart’s 1932 solo flight across the Atlantic ______ she completed it in just under fifteen hours, landing in a pasture in Northern Ireland.", q:CONV,
  c:["was record-setting:","was record-setting,","was record-setting","being record-setting;"], a:0, e:"A colon can join two independent clauses when the second explains the first. A comma creates a comma splice, and no punctuation creates a run-on." },
{ id:"sec6", d:"sec", t:2, p:"The rhythms of the traditional drumming style, which originated in coastal villages and later spread inland, ______ notoriously difficult for newcomers to master.", q:CONV,
  c:["are","is","was","has been"], a:0, e:"The subject is the plural “rhythms”; the phrase “of the traditional drumming style” and the clause between commas do not change that." },
{ id:"sec7", d:"sec", t:2, p:"The poet Gwendolyn ______ the first Black author to win the Pulitzer Prize, grew up in Chicago.", q:CONV,
  c:["Brooks,","Brooks","Brooks;","Brooks:"], a:0, e:"The appositive “the first Black author to win the Pulitzer Prize” is nonessential and must be set off by a pair of commas." },
{ id:"sec8", d:"sec", t:2, p:"The engineers tested the bridge design by simulating heavy traffic, applying lateral wind loads, and ______ the effects of a moderate earthquake.", q:CONV,
  c:["modeling","to model","they modeled","having modeled"], a:0, e:"Items in a list must be parallel; “simulating” and “applying” call for a third gerund, “modeling.”" },
{ id:"sec9", d:"sec", t:2, p:"The expedition’s team included a geologist from Lima, ______ a botanist from Nairobi, Kenya; and two graduate students from Montreal, Canada.", q:CONV,
  c:["Peru;","Peru,","Peru:","Peru"], a:0, e:"When list items contain commas, semicolons separate the items, as they do later in the sentence." },
{ id:"sec10", d:"sec", t:2, p:"The researcher ______ findings prompted the recall had spent three years studying the alloy’s behavior under stress.", q:CONV,
  c:["whose","who’s","which","that’s"], a:0, e:"The possessive relative pronoun “whose” shows the findings belong to the researcher; “who’s” means “who is.”" },
{ id:"sec11", d:"sec", t:2, p:"Three ingredients—flour, water, and ______ are all that a traditional loaf requires.", q:CONV,
  c:["salt—","salt,","salt;","salt:"], a:0, e:"An interrupting list opened with a dash must be closed with a dash; mixing a dash with a comma is incorrect." },
{ id:"sec12", d:"sec", t:3, p:"Had the surveyors measured the ridge more carefully in 1887, the boundary between the two counties ______ several miles farther east today.", q:CONV,
  c:["would lie","will lie","would have lain","lies"], a:0, e:"An unreal past condition with a present result (“today”) takes “would” plus the base verb: “would lie.” “Would have lain” would describe a past result." },
{ id:"sec13", d:"sec", t:3, p:"Among the artifacts recovered from the wreck ______ a set of navigational instruments that had survived two centuries underwater.", q:CONV,
  c:["was","were","have been","are"], a:0, e:"The sentence is inverted; its subject is the singular “a set,” so the verb must be singular." },
{ id:"sec14", d:"sec", t:3, p:"The only building on the block ______ is the small brick firehouse on the corner.", q:CONV,
  c:["that survived the 1906 fire","that survived the 1906 fire,",", which survived the 1906 fire,",", that survived the 1906 fire,"], a:0, e:"The clause identifies which building is meant, so it is essential and takes no commas; “that” introduces essential clauses." },
{ id:"sec15", d:"sec", t:3, p:"Neither the two assistants nor the lead curator ______ aware that the painting had been reattributed.", q:CONV,
  c:["was","were","have been","are"], a:0, e:"With “neither … nor,” the verb agrees with the nearer subject, the singular “curator,” so “was” is correct." },
{ id:"sec16", d:"sec", t:3, p:"Migrating monarch butterflies navigate using the sun’s position, ______ an internal clock that compensates for the sun’s movement across the sky.", q:CONV,
  c:["relying on","they rely on","and rely","which relying on"], a:0, e:"The participial phrase “relying on…” correctly modifies the butterflies. “They rely on” creates a comma splice, and the other options are ungrammatical." },

/* ---------------- Expression of Ideas ---------------- */
{ id:"eoi1", d:"eoi", t:1, p:"The first bicycles had no pedals; riders pushed themselves along with their feet. ______ in the 1860s, French inventors attached cranks to the front wheel, creating the first pedal-driven bicycle.", q:TRANS,
  c:["Then,","For example,","In other words,","Nevertheless,"], a:0, e:"The second sentence describes the next step in a sequence of events, so a time transition such as “Then” fits." },
{ id:"eoi2", d:"eoi", t:1, p:"Octopuses are remarkably intelligent: they solve puzzles, use tools, and recognize individual humans. ______ their nervous systems are organized very differently from those of vertebrates, with most of their neurons located in their arms rather than in a central brain.", q:TRANS,
  c:["However,","Therefore,","Similarly,","Consequently,"], a:0, e:"The text shifts from octopus intelligence to a surprising difference in their nervous systems, so a contrast transition is needed." },
{ id:"eoi3", d:"eoi", t:1, notes:["Wangari Maathai was a Kenyan environmental activist.","In 1977, she founded the Green Belt Movement.","The movement paid rural women to plant trees.","By 2004, the movement had planted more than 30 million trees.","In 2004, Maathai became the first African woman to win the Nobel Peace Prize."], q:NOTES_Q("emphasize the scale of the Green Belt Movement’s impact"),
  c:["By 2004, the Green Belt Movement, founded by Wangari Maathai in 1977, had planted more than 30 million trees.","Wangari Maathai was a Kenyan environmental activist who founded the Green Belt Movement.","The Green Belt Movement paid rural women to plant trees.","In 2004, Wangari Maathai won the Nobel Peace Prize."], a:0, e:"Only the sentence citing more than 30 million trees gives a figure that conveys scale." },
{ id:"eoi4", d:"eoi", t:1, p:"Many people assume that lightning never strikes the same place twice. ______ tall structures such as the Empire State Building are struck dozens of times each year.", q:TRANS,
  c:["In fact,","As a result,","Likewise,","Finally,"], a:0, e:"The second sentence corrects a common assumption with a surprising truth, which “In fact” signals." },
{ id:"eoi5", d:"eoi", t:1, notes:["The Great Barrier Reef is off the coast of Queensland, Australia.","It is the largest coral reef system in the world.","It stretches about 2,300 kilometers.","It is made up of nearly 3,000 individual reefs.","It can be seen from space."], q:NOTES_Q("introduce the Great Barrier Reef to an audience unfamiliar with it"),
  c:["The Great Barrier Reef, located off the coast of Queensland, Australia, is the largest coral reef system in the world.","Nearly 3,000 individual reefs stretch about 2,300 kilometers.","Because it can be seen from space, the reef is very large.","Queensland, Australia, has a coast."], a:0, e:"An introduction for an unfamiliar audience should name the reef, say where it is, and say what it is; only the sentence that does all three works." },
{ id:"eoi6", d:"eoi", t:2, p:"The city’s plan to replace its aging streetlights with LEDs was expected to cut electricity costs by 40 percent. ______ the savings turned out to be closer to 60 percent, because the new lights also required far less maintenance.", q:TRANS,
  c:["In the end,","For instance,","By contrast,","Specifically,"], a:0, e:"The second sentence reports the eventual outcome of the plan, so “In the end” is the logical transition." },
{ id:"eoi7", d:"eoi", t:2, notes:["Ada Lovelace (1815–1852) was an English mathematician.","She worked with Charles Babbage on his proposed Analytical Engine.","In 1843, she published notes describing how the engine could compute Bernoulli numbers.","Her notes are considered by many to contain the first computer program.","The Analytical Engine was never built during her lifetime."], q:NOTES_Q("emphasize a surprising aspect of Lovelace’s achievement"),
  c:["Lovelace wrote what many consider the first computer program in 1843, for a machine that was never built during her lifetime.","Ada Lovelace was an English mathematician who lived from 1815 to 1852.","Charles Babbage proposed a machine called the Analytical Engine.","Lovelace’s 1843 notes described how to compute Bernoulli numbers."], a:0, e:"Writing the first program for a machine that never existed is the surprising element; the correct sentence pairs those two facts." },
{ id:"eoi8", d:"eoi", t:2, p:"Some historians credit the invention of the stirrup with transforming medieval warfare by making mounted combat far more effective. Others are skeptical, noting that cavalry dominated battlefields in several regions long before stirrups arrived. ______ the stirrup’s precise role remains a matter of debate.", q:TRANS,
  c:["Thus,","Moreover,","For example,","Instead,"], a:0, e:"The last sentence draws a conclusion from the disagreement just described, so “Thus” fits." },
{ id:"eoi9", d:"eoi", t:2, notes:["A student is comparing two methods of desalination (removing salt from seawater).","Thermal distillation heats seawater until it evaporates, then condenses the fresh water.","Reverse osmosis pushes seawater through a membrane that blocks salt.","Thermal distillation typically uses two to three times as much energy per liter as reverse osmosis.","Reverse osmosis membranes must be replaced every few years."], q:NOTES_Q("present a disadvantage of each method"),
  c:["Thermal distillation uses two to three times as much energy as reverse osmosis, while reverse osmosis requires membranes that must be replaced every few years.","Both thermal distillation and reverse osmosis remove salt from seawater.","Reverse osmosis pushes seawater through a membrane that blocks salt.","Thermal distillation heats seawater until it evaporates and then condenses the fresh water."], a:0, e:"The correct sentence names one drawback for each method (energy use; membrane replacement); the others only describe how the methods work." },
{ id:"eoi10", d:"eoi", t:2, p:"Early weather forecasts relied on telegraph reports from distant stations, which took hours to collect. ______ forecasters could rarely warn of a storm more than a day in advance.", q:TRANS,
  c:["As a result,","On the other hand,","In addition,","Meanwhile,"], a:0, e:"Slow data collection caused short warning times, so a cause-and-effect transition is needed." },
{ id:"eoi11", d:"eoi", t:2, notes:["The Voyager 1 spacecraft launched in 1977.","Its original mission was to study Jupiter and Saturn.","In 2012, it became the first human-made object to enter interstellar space.","It carries a golden record with sounds and images from Earth.","It is now more than 24 billion kilometers from Earth."], q:NOTES_Q("emphasize how far the spacecraft has traveled beyond its original goals"),
  c:["Launched in 1977 to study Jupiter and Saturn, Voyager 1 has since become the first human-made object to enter interstellar space and is now more than 24 billion kilometers from Earth.","Voyager 1 carries a golden record with sounds and images from Earth.","Voyager 1 launched in 1977.","The original mission of Voyager 1 was to study Jupiter and Saturn."], a:0, e:"The correct sentence states the original goal and then how far beyond it the craft has gone, which is exactly the contrast the student wants." },
{ id:"eoi12", d:"eoi", t:3, p:"Antibiotic resistance is often blamed on the overuse of antibiotics in medicine. Agriculture, ______, accounts for a majority of antibiotic use in many countries, since livestock are routinely given the drugs to promote growth.", q:TRANS,
  c:["however","for example","as a result","in short"], a:0, e:"The text contrasts the usual explanation (medicine) with a larger source (agriculture), so “however” fits." },
{ id:"eoi13", d:"eoi", t:3, notes:["Two types of volcanoes are shield volcanoes and stratovolcanoes.","Shield volcanoes have gentle slopes and are built from fluid, low-silica lava.","Mauna Loa in Hawaii is a shield volcano.","Stratovolcanoes have steep slopes and are built from sticky, high-silica lava and ash.","Mount Fuji in Japan is a stratovolcano.","Stratovolcano eruptions tend to be more explosive."], q:NOTES_Q("explain why the two volcano types differ in shape"),
  c:["Shield volcanoes have gentle slopes because they are built from fluid, low-silica lava, whereas stratovolcanoes are steep because they are built from sticky, high-silica lava and ash.","Mauna Loa is a shield volcano, and Mount Fuji is a stratovolcano.","Stratovolcano eruptions tend to be more explosive than shield volcano eruptions.","Shield volcanoes and stratovolcanoes are two types of volcanoes with different shapes."], a:0, e:"The goal is a cause-and-effect explanation of shape; only the sentence that links each shape to the kind of lava that builds it explains why." },
{ id:"eoi14", d:"eoi", t:3, p:"The museum’s decision to return the sculptures was praised by many as long overdue. The praise was not universal, ______: several curators argued that the sculptures would be at risk in a region with limited conservation facilities.", q:TRANS,
  c:["though","for instance","therefore","likewise"], a:0, e:"The second sentence qualifies the first by noting dissent, so the concessive “though” is correct." },
{ id:"eoi15", d:"eoi", t:3, notes:["Hedy Lamarr (1914–2000) was a Hollywood film actress.","During World War II, she co-invented a “frequency hopping” system with composer George Antheil.","The system was designed to keep radio-guided torpedoes from being jammed.","The idea was not adopted by the U.S. Navy until the 1960s.","Frequency-hopping principles underlie modern Bluetooth and Wi-Fi technologies."], q:NOTES_Q("emphasize the long-term significance of Lamarr’s invention"),
  c:["Although the Navy did not adopt it until the 1960s, the frequency-hopping system Lamarr co-invented during World War II underlies modern Bluetooth and Wi-Fi technologies.","Hedy Lamarr was a Hollywood film actress who lived from 1914 to 2000.","Lamarr co-invented a frequency-hopping system with composer George Antheil.","The frequency-hopping system was designed to keep radio-guided torpedoes from being jammed."], a:0, e:"Long-term significance means today’s technology; the correct sentence connects the wartime invention to modern Bluetooth and Wi-Fi." },
{ id:"eoi16", d:"eoi", t:3, p:"Researchers had assumed that deep-sea vent communities depended on sunlight-driven food chains near the surface. The discovery of bacteria that draw energy directly from chemicals in the vent water overturned that assumption. ______ it raised the possibility that life could exist on worlds with no sunlight at all.", q:TRANS,
  c:["Moreover,","Nonetheless,","Instead,","For example,"], a:0, e:"The last sentence adds a second, larger consequence of the discovery, so an additive transition such as “Moreover” fits." },

/* ---------------- Algebra ---------------- */
{ id:"alg1", d:"alg", t:1, q:"If 3x + 7 = 22, what is the value of x?", c:["3","5","7","15"], a:1, e:"Subtract 7 from both sides to get 3x = 15, then divide by 3: x = 5." },
{ id:"alg2", d:"alg", t:1, q:"What value of y satisfies the equation 4y − 9 = 19?", spr:true, a:7, e:"Add 9 to both sides: 4y = 28, so y = 7." },
{ id:"alg3", d:"alg", t:1, q:"The function f is defined by f(x) = 6x − 4. What is the value of f(5)?", c:["7","26","30","34"], a:1, e:"Substitute 5 for x: 6(5) − 4 = 30 − 4 = 26." },
{ id:"alg4", d:"alg", t:1, q:"Line k in the xy-plane has a slope of 2 and passes through the point (0, −3). Which equation represents line k?", c:["y = 2x − 3","y = −3x + 2","y = 2x + 3","y = 3x − 2"], a:0, e:"In y = mx + b, m is the slope (2) and b is the y-intercept (−3), giving y = 2x − 3." },
{ id:"alg5", d:"alg", t:1, q:"A gym charges a one-time sign-up fee of $25 plus $15 per month. A member has paid a total of $160, including the sign-up fee. For how many months has the member paid?", spr:true, a:9, e:"Solve 25 + 15m = 160: 15m = 135, so m = 9." },
{ id:"alg6", d:"alg", t:2, q:"2x + y = 11\nx − y = 1\n\nWhich ordered pair (x, y) is the solution to the system of equations above?", c:["(4, 3)","(3, 4)","(5, 1)","(2, 7)"], a:0, e:"Adding the equations eliminates y: 3x = 12, so x = 4. Then 4 − y = 1 gives y = 3." },
{ id:"alg7", d:"alg", t:2, q:"If 5(x − 2) = 3x + 8, what is the value of x?", spr:true, a:9, e:"Distribute: 5x − 10 = 3x + 8. Then 2x = 18, so x = 9." },
{ id:"alg8", d:"alg", t:2, q:"A line in the xy-plane passes through the points (2, 5) and (6, 13). Which of the following points also lies on the line?", c:["(0, 1)","(1, 2)","(4, 8)","(3, 6)"], a:0, e:"The slope is (13 − 5)/(6 − 2) = 2, so y = 2x + b; using (2, 5) gives b = 1. The point (0, 1) satisfies y = 2x + 1." },
{ id:"alg9", d:"alg", t:2, q:"Which inequality has the same solution set as 3 − 2x > 11?", c:["x < −4","x > −4","x < 4","x > −7"], a:0, e:"Subtract 3: −2x > 8. Dividing by −2 reverses the inequality: x < −4." },
{ id:"alg10", d:"alg", t:2, q:"A landscaper charges a flat fee of $40 plus $18 per hour of work. Which function gives the total charge C(h), in dollars, for h hours of work?", c:["C(h) = 18h + 40","C(h) = 40h + 18","C(h) = 58h","C(h) = 18(h + 40)"], a:0, e:"The hourly rate multiplies the hours (18h), and the flat fee is added once (+ 40)." },
{ id:"alg11", d:"alg", t:2, q:"3x + 2y = 16\nx = 2y\n\nIf (x, y) is the solution to the system above, what is the value of x + y?", spr:true, a:6, e:"Substitute x = 2y: 6y + 2y = 16, so y = 2 and x = 4. Then x + y = 6." },
{ id:"alg12", d:"alg", t:3, q:"2x − 3y = 7\nkx − 9y = 5\n\nIn the system above, k is a constant. For what value of k does the system have no solution?", c:["6","−6","3","2/3"], a:0, e:"No solution means the lines are parallel: the coefficients must be proportional. Since −9 is 3 times −3, k must be 3 times 2, or 6 (and 5 ≠ 3·7, so the lines are distinct)." },
{ id:"alg13", d:"alg", t:3, q:"y = 4x − 7\ny = −2x + 11\n\nIf (a, b) is the solution to the system above, what is the value of a?", spr:true, a:3, e:"Set the expressions equal: 4x − 7 = −2x + 11, so 6x = 18 and x = 3." },
{ id:"alg14", d:"alg", t:3, q:"The graph of y = mx + b in the xy-plane passes through the points (−2, 9) and (4, −3), where m and b are constants. What is the value of b?", c:["5","1","−2","7"], a:0, e:"Slope m = (−3 − 9)/(4 − (−2)) = −2. Then 9 = −2(−2) + b, so b = 5." },
{ id:"alg15", d:"alg", t:3, q:"A store sells notebooks for $3 each and pens for $2 each. Malik bought 14 items from the store for a total of $36. How many notebooks did Malik buy?", spr:true, a:8, e:"With n notebooks and 14 − n pens: 3n + 2(14 − n) = 36, so n + 28 = 36 and n = 8." },
{ id:"alg16", d:"alg", t:3, q:"The line with equation ax + by = 12, where a and b are constants, has an x-intercept of (3, 0) and a y-intercept of (0, −4). What is the value of a + b?", c:["1","7","−1","12"], a:0, e:"At (3, 0): 3a = 12, so a = 4. At (0, −4): −4b = 12, so b = −3. Then a + b = 1." },

/* ---------------- Advanced Math ---------------- */
{ id:"adv1", d:"adv", t:1, q:"Which expression is equivalent to (x + 3)(x − 5)?", c:["x² − 2x − 15","x² + 2x − 15","x² − 15","x² − 8x − 15"], a:0, e:"FOIL: x² − 5x + 3x − 15 = x² − 2x − 15." },
{ id:"adv2", d:"adv", t:1, q:"If x² = 49 and x > 0, what is the value of x?", spr:true, a:7, e:"The positive square root of 49 is 7." },
{ id:"adv3", d:"adv", t:1, q:"What are the solutions to the equation x² − 7x + 12 = 0?", c:["3 and 4","−3 and −4","2 and 6","−2 and −6"], a:0, e:"Factor: (x − 3)(x − 4) = 0, so x = 3 or x = 4." },
{ id:"adv4", d:"adv", t:1, q:"The function g is defined by g(x) = 2ˣ. What is the value of g(5)?", c:["10","25","32","64"], a:2, e:"2⁵ = 2·2·2·2·2 = 32." },
{ id:"adv5", d:"adv", t:1, q:"The graph of y = x² − 6x + 8 in the xy-plane crosses the y-axis at the point (0, c). What is the value of c?", spr:true, a:8, e:"On the y-axis, x = 0, so y = 0 − 0 + 8 = 8." },
{ id:"adv6", d:"adv", t:2, q:"Which expression is equivalent to (3x²y³)²?", c:["9x⁴y⁶","6x⁴y⁶","9x⁴y⁵","3x⁴y⁶"], a:0, e:"Square each factor: 3² = 9, (x²)² = x⁴, and (y³)² = y⁶." },
{ id:"adv7", d:"adv", t:2, q:"The function f is defined by f(x) = x² − 4x + 1. For what value of x does f reach its minimum value?", spr:true, a:2, e:"The vertex of ax² + bx + c is at x = −b/(2a) = 4/2 = 2." },
{ id:"adv8", d:"adv", t:2, q:"A bacteria population doubles every 3 hours. There are 500 bacteria at the start. Which function gives the population P(t) after t hours?", c:["P(t) = 500(2)^(t/3)","P(t) = 500(2)^(3t)","P(t) = 500 + 2t/3","P(t) = 500(3)^(t/2)"], a:0, e:"Doubling every 3 hours means the exponent counts 3-hour periods: t/3. So P(t) = 500·2^(t/3)." },
{ id:"adv9", d:"adv", t:2, q:"What is the sum of the solutions to the equation x² + 5x − 24 = 0?", c:["−5","5","−24","11"], a:0, e:"Factor: (x + 8)(x − 3) = 0, so the solutions are −8 and 3, whose sum is −5. (For x² + bx + c, the sum is always −b.)" },
{ id:"adv10", d:"adv", t:2, q:"If √(x + 7) = 5, what is the value of x?", spr:true, a:18, e:"Square both sides: x + 7 = 25, so x = 18." },

{ id:"psd6", d:"psd", t:2, q:"A jacket with an original price of $80 is on sale for 25% off. A 5% sales tax is then applied to the sale price. What is the total cost of the jacket?", c:["$63.00","$64.00","$60.00","$66.00"], a:0, e:"The sale price is 80 × 0.75 = $60, and with tax it is 60 × 1.05 = $63." },
{ id:"psd7", d:"psd", t:2, q:"What is the median of the data set 12, 5, 9, 20, 7, 15?", spr:true, a:10.5, e:"Order the values: 5, 7, 9, 12, 15, 20. With six values the median is the mean of the middle two: (9 + 12)/2 = 10.5." },

{ id:"psd12", d:"psd", t:3, q:"The mean of five numbers is 18. When a sixth number is added to the set, the mean of the six numbers is 20. What is the sixth number?", c:["30","20","22","28"], a:0, e:"The five numbers sum to 5 × 18 = 90; the six numbers sum to 6 × 20 = 120. The sixth number is 120 − 90 = 30." },

{ id:"geo8", d:"geo", t:2, q:"A circle in the xy-plane has the equation (x − 3)² + (y + 2)² = 25. What are the center and radius of the circle?", c:["Center (3, −2), radius 5","Center (−3, 2), radius 5","Center (3, −2), radius 25","Center (−3, 2), radius 25"], a:0, e:"The form (x − h)² + (y − k)² = r² gives center (h, k) = (3, −2) and r = √25 = 5." },

const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nl = (s) => esc(s).replace(/\n/g, "<br>");
function fmt(n) {
  if (!isFinite(n)) return "∞";
  const neg = n < 0; n = Math.abs(n);
  let out;
  if (n < 1000) out = n < 10 && n % 1 ? n.toFixed(1) : String(Math.floor(n));
  else {
    const u = ["K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp"]; let i = -1; let v = n;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    out = v.toFixed(v < 10 ? 2 : v < 100 ? 1 : 0) + u[i];
  }
  return (neg ? "-" : "") + out;
}
const fmtRate = (n) => (n < 10 ? n.toFixed(1) : fmt(n));
function fmtDur(s) {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return `${h}h ${m}m`; if (m > 0) return `${m}m ${sec}s`; return `${sec}s`;
}
const fmtClock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function dayKey(d = new Date()) { return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function daysBetween(k1, k2) {
  const p = (k) => { const [y, m, d] = k.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  return Math.round((p(k2) - p(k1)) / 86400000);
}
function weighted(weights) {
  let t = 0; for (const w of weights) t += w;
  let r = Math.random() * t;
  for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r <= 0) return i; }
  return weights.length - 1;
}

const production = (withBoost = true) => baseProd() * prodMult(withBoost);

  let m = starMult(); if (S.res.lab1) m *= 1.5; if (S.res.lab2) m *= 1.5; if (S.res.lab3) m *= 2; if (S.perks.insight) m *= 1.5; return m;

   Questions, mastery, sessions
   ================================================================ */
let cur = null;                       // current question {q, review, start, done, hinted, gone}
let session = { n: 0, c: 0, earned: 0, results: [], snap: null, recent: [] };
const qstat = (id) => S.q[id] || { n: 0, c: 0, last: 0 };
const dueReview = (dom) => S.review.find((r) => r.due <= S.stats.answered && (!dom || r.d === dom));
function pickDomain() {
  if (S.focus !== "mix" && DOM[S.focus]) return S.focus;
  // Due reviews come back promptly: most of the time, mixed practice goes straight to one.
  const due = S.review.filter((r) => r.due <= S.stats.answered && !(cur && cur.q.id === r.id));
  if (due.length && Math.random() < 0.7) return due[0].d;
  const w = DOMAINS.map((d) => {
    let x = 1.25 - S.dom[d.id].r;
    if (dueReview(d.id)) x *= 1.6;
    if (session.recent.includes(d.id)) x *= 0.3;

}
function pickTier(r, n) {

}
function pickQuestion() {
  const dom = pickDomain();
  const rev = dueReview(dom);
  if (rev && (BANK_BY_ID[rev.id] || rev.qo) && (!cur || cur.q.id !== rev.id)) return { q: BANK_BY_ID[rev.id] || rev.qo, review: true };
  const tier = pickTier(S.dom[dom].r, S.dom[dom].n);
  let pool = BANK.filter((q) => q.d === dom && q.t === tier && !(cur && cur.q.id === q.id));
  if (!pool.length) pool = BANK.filter((q) => q.d === dom);
  // Procedural drills fill in once the written questions at this tier have been seen (and sometimes before).
  if (GEN[dom] && S.dom[dom].n >= 3 && tier < 3) {
    const unseen = pool.filter((q) => qstat(q.id).n === 0).length;
    if (Math.random() < (unseen === 0 ? 0.55 : 0.2)) { const g = genQuestion(dom, tier); if (g) return { q: g, review: false }; }
  }
  pool.sort((a, b) => qstat(a.id).n - qstat(b.id).n || qstat(a.id).last - qstat(b.id).last);
  const minSeen = qstat(pool[0].id).n;
  const cands = pool.filter((q) => qstat(q.id).n === minSeen);
  return { q: pick(cands), review: false };
}
function nextQuestion() {
  const p = pickQuestion();
  const order = p.q.spr ? null : [0, 1, 2, 3];
  if (order) for (let i = 3; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  cur = { q: p.q, review: p.review, order, start: performance.now(), done: false, hinted: false, gone: -1, correct: null, chosen: null };
  session.recent.push(p.q.d); if (session.recent.length > 2) session.recent.shift();

function parseNum(s) {

  const correct = q.spr ? sprMatch(q, sprVal) : choiceIdx === q.a;
  const elapsed = (performance.now() - cur.start) / 1000;
  const key = q.tid || q.id; const st = qstat(key); const repeat = !q.gen && st.n > 0;
  const fullReview = cur.review && S.res.scan;

  const diff = TIER_DIFF[q.t - 1];

  S.stats.answered++;
  const par = PAR[DOM[q.d].sec] * (S.res.dilate ? 0.75 : 0.5);

   ================================================================ */
const MISSION_TYPES = {
  correct: { gen: () => ({ dom: pick(DOMAINS).id, target: 3 + Math.floor(Math.random() * 3) }), text: (m) => `Answer ${m.target} ${DOM[m.dom].name} questions correctly` },
  combo:   { gen: () => ({ target: pick([4, 6, 8, 10]) }), text: (m) => `Reach a ${m.target} combo` },
  hard:    { gen: () => ({ target: 2 + Math.floor(Math.random() * 2) }), text: (m) => `Answer ${m.target} hard questions correctly` },
  buy:     { gen: () => ({ target: 3 + Math.floor(Math.random() * 5) }), text: (m) => `Buy ${m.target} station upgrades` },
  review:  { gen: () => ({ target: 1 + Math.floor(Math.random() * 2) }), text: (m) => `Clear ${m.target} review question${m.target > 1 ? "s" : ""}` },
  earn:    { gen: () => ({ target: Math.max(200, Math.round((production(false) * 240 + 200) / 10) * 10) }), text: (m) => `Earn ${fmt(m.target)} Data` },
  mixed:   { gen: () => ({ target: 4 + Math.floor(Math.random() * 3) }), text: (m) => `Answer ${m.target} questions correctly in Mixed focus` },
};
function newMission(exclude) {
  const keys = Object.keys(MISSION_TYPES).filter((k) => !exclude.includes(k));
  const type = pick(keys); const m = MISSION_TYPES[type].gen();
  m.type = type; m.prog = 0;
